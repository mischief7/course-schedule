<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="课程表">
<meta name="theme-color" content="#1d1d1f">
<meta name="description" content="教师课程表 - 日历视图/日视图，一键导出iOS日历提醒">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%234CAF50'/><text x='90' y='115' text-anchor='middle' font-size='100' font-family='sans-serif'>📅</text></svg>">
<title>课程表</title>
<style>
:root {
  --bg: #f5f5f7; --surface: #ffffff; --text: #1d1d1f; --text2: #6e6e73; --text3: #aeaeb2;
  --border: #e5e5ea; --accent: #4CAF50; --accent-hover: #43a047; --danger: #ff3b30;
  --shadow: 0 2px 12px rgba(0,0,0,.08); --radius: 14px; --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  --header-h: 52px; --nav-h: 44px; --footer-h: 56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);height:100%;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--text);-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:none}

#app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto;position:relative}

.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-top) + 6px) 16px 6px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;
}
.header h1{font-size:18px;font-weight:700}
.header-actions{display:flex;gap:4px}
.btn-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s}
.btn-icon:active{background:var(--border)}

.week-nav{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 12px;background:var(--surface);flex-shrink:0;border-bottom:1px solid var(--border);
}
.week-nav-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--bg);transition:background .15s}
.week-nav-btn:active{background:var(--border)}
.week-nav-info{font-size:13px;font-weight:600;text-align:center;min-width:160px;line-height:1.3}
.btn-today{font-size:11px;padding:4px 10px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}

.view-toggle{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.view-toggle button{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2);transition:all .2s}
.view-toggle button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.main-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

#weekView{padding:4px 4px 80px;display:none}
#weekView.active{display:block}
.week-grid{display:grid;grid-template-columns:44px repeat(7,1fr);min-width:100%}
.week-grid-header{position:sticky;top:0;z-index:5;display:contents}
.week-grid-header .time-label{background:var(--bg)}
.week-grid-header .day-label{background:var(--surface);text-align:center;padding:6px 2px;font-size:10px;font-weight:600;border-bottom:2px solid var(--border);line-height:1.3}
.week-grid-header .day-label span{display:block;font-size:9px;color:var(--text2);font-weight:400}
.week-grid-header .day-label.today{border-bottom-color:var(--accent);color:var(--accent)}
.week-grid-header .day-label.today span{color:var(--accent)}

.time-label{
  font-size:8px;color:var(--text3);text-align:right;padding:0 3px 0 0;
  height:6px;line-height:6px;
}
.day-col{position:relative;min-height:6px}

.course-block{
  position:absolute;left:1px;right:1px;border-radius:4px;padding:2px 3px;
  font-size:9px;line-height:1.2;overflow:hidden;cursor:pointer;
  color:#fff;font-weight:600;z-index:2;transition:transform .1s,box-shadow .1s;
  border-left:2px solid rgba(255,255,255,.3);
}
.course-block:active{transform:scale(.97);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.course-block .c-name{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-block .c-detail{font-size:7px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-block .c-tiny{font-size:7px;opacity:.7}

#dayView{padding:8px 12px 80px;display:none}
#dayView.active{display:block}
.day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.day-header h2{font-size:17px;font-weight:700}
.day-nav{display:flex;gap:4px}

.day-card{
  background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;
  box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;
}
.day-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.day-card .dc-time{font-size:14px;font-weight:700;margin-bottom:4px}
.day-card .dc-name{font-size:16px;font-weight:600;margin-bottom:3px}
.day-card .dc-info{font-size:12px;color:var(--text2);margin-bottom:1px}
.day-card .dc-tuition{font-size:12px;font-weight:600;color:#e65100}
.day-empty{text-align:center;padding:60px 20px;color:var(--text3)}
.day-empty .empty-icon{font-size:48px;margin-bottom:12px}

.footer{
  display:flex;gap:10px;padding:10px 16px calc(10px + var(--safe-bottom));
  background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;
}
.btn-primary{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;background:var(--accent);color:#fff;text-align:center;transition:background .15s}
.btn-primary:active{background:var(--accent-hover)}
.btn-secondary{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;background:var(--bg);color:var(--text);text-align:center;transition:background .15s}
.btn-secondary:active{background:var(--border)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);width:100%;max-width:600px;max-height:90vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideUp .25s;padding-bottom:var(--safe-bottom)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:17px;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px}
.modal-footer{display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--border)}
.modal-footer .btn-danger{color:var(--danger);font-weight:600;font-size:14px}

/* Form */
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);transition:border .15s}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-group input[type=number]{-moz-appearance:textfield}
.form-group input[type=number]::-webkit-outer-spin-button,.form-group input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.form-hint{font-size:10px;color:var(--text2);margin-top:3px}
.required-star{color:var(--danger)}

/* Color Picker */
.color-picker{display:flex;gap:6px;flex-wrap:wrap}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
.color-dot:active{transform:scale(.9)}
.color-dot.selected{border-color:var(--text);box-shadow:0 0 0 3px rgba(0,0,0,.1)}

/* Settings */
.settings-section{margin-bottom:20px}
.settings-section h3{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.settings-card{background:var(--bg);border-radius:var(--radius-sm);overflow:hidden}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px}
.settings-item:last-child{border-bottom:none}
.settings-item .si-right{color:var(--text2);font-size:13px}
.settings-item button{color:var(--danger);font-weight:600;font-size:14px}
.settings-item .btn-data{color:var(--accent);font-weight:600;font-size:14px}
.settings-desc{font-size:12px;color:var(--text2);padding:0 16px 12px;line-height:1.5}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;white-space:nowrap;animation:toastIn .3s,toastOut .3s 2s forwards;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

/* Install Banner */
.install-banner{position:fixed;bottom:90px;left:16px;right:16px;z-index:90;background:var(--surface);border-radius:var(--radius);padding:14px 18px;box-shadow:0 4px 24px rgba(0,0,0,.15);display:flex;align-items:center;gap:12px;animation:slideUp .3s}
.install-banner .ib-text{flex:1;font-size:13px;font-weight:600}
.install-banner .ib-btn{padding:8px 16px;border-radius:16px;background:var(--accent);color:#fff;font-size:13px;font-weight:600}

#importFile{display:none}
.repeat-row{padding:10px 14px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:4px}
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <h1>📅 课程表</h1>
    <div class="header-actions">
      <div class="view-toggle" id="viewToggle">
        <button data-view="week" class="active">周</button>
        <button data-view="day">日</button>
      </div>
      <button class="btn-icon" id="btnSettings" title="设置">⚙</button>
    </div>
  </header>

  <nav class="week-nav" id="weekNav">
    <button class="week-nav-btn" id="btnPrev">◀</button>
    <div class="week-nav-info" id="weekInfo">3月10日 - 3月16日</div>
    <button class="week-nav-btn" id="btnNext">▶</button>
    <button class="btn-today" id="btnToday">今天</button>
  </nav>

  <main class="main-content" id="mainContent">
    <div id="weekView" class="active"></div>
    <div id="dayView"></div>
  </main>

  <footer class="footer">
    <button class="btn-primary" id="btnAddCourse">+ 添加课程</button>
    <button class="btn-secondary" id="btnExport">📥 导出日历</button>
  </footer>
</div>

<!-- Course Modal -->
<div class="modal-overlay" id="courseModal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">添加课程</h2>
      <button class="btn-icon" id="btnCloseModal">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="courseId">
      <div class="form-group">
        <label>课程名称 <span class="required-star">*</span></label>
        <input type="text" id="cName" placeholder="如：钢琴课">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>学生 <span class="required-star">*</span></label>
          <input type="text" id="cStudent" placeholder="学生姓名">
        </div>
        <div class="form-group">
          <label>上课地点</label>
          <input type="text" id="cLocation" placeholder="如：琴房A">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>机构</label>
          <input type="text" id="cOrg" placeholder="如：XX音乐培训">
        </div>
        <div class="form-group">
          <label>学费 (RMB) <span class="required-star">*</span></label>
          <input type="number" id="cTuition" placeholder="0" min="0" step="0.01">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>上课日期 <span class="required-star">*</span></label>
          <input type="date" id="cDate">
        </div>
        <div class="form-group">
          <label>颜色标签</label>
          <div class="color-picker" id="colorPicker"></div>
          <input type="hidden" id="cColor" value="#4CAF50">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>开始时间 <span class="required-star">*</span></label>
          <select id="cStart"></select>
        </div>
        <div class="form-group">
          <label>结束时间 <span class="required-star">*</span></label>
          <select id="cEnd"></select>
        </div>
      </div>
      <div class="repeat-row">
        <div class="form-group" style="margin-bottom:0">
          <label>重复模式</label>
          <select id="cRepeat">
            <option value="none">不重复（仅此一次）</option>
            <option value="weekly">每周重复</option>
          </select>
        </div>
        <div class="form-group" id="repeatUntilGroup" style="display:none;margin-top:8px;margin-bottom:0">
          <label>重复截止日期 <span class="required-star">*</span></label>
          <input type="date" id="cRepeatUntil">
          <div class="form-hint">从上课日期起，每周同一天重复，直到截止日期</div>
        </div>
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="cNote" placeholder="如：带教材、注意事项等">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-danger" id="btnDelete" style="display:none">删除课程</button>
      <div style="flex:1"></div>
      <button class="btn-secondary" id="btnCancel">取消</button>
      <button class="btn-primary" id="btnSave" style="flex:0 1 auto;padding:10px 24px">保存</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h2>设置</h2>
      <button class="btn-icon" id="btnCloseSettings">✕</button>
    </div>
    <div class="modal-body">
      <div class="settings-section">
        <h3>课程表信息</h3>
        <div class="settings-card">
          <div class="form-group" style="padding:0 16px 14px">
            <label>课程表名称</label>
            <input type="text" id="sName" placeholder="我的课程表">
          </div>
        </div>
        <div class="settings-desc">所有课程数据保存在手机本地，不上传任何服务器。</div>
      </div>
      <div class="settings-section">
        <h3>数据管理</h3>
        <div class="settings-card">
          <div class="settings-item">
            <span>导出数据备份</span>
            <button class="btn-data" id="btnExportData">导出JSON</button>
          </div>
          <div class="settings-item">
            <span>导入数据恢复</span>
            <button class="btn-data" id="btnImportData">导入JSON</button>
          </div>
          <div class="settings-item">
            <span>清空所有数据</span>
            <button id="btnClearAll">清空</button>
          </div>
        </div>
        <input type="file" id="importFile" accept=".json">
      </div>
    </div>
  </div>
</div>

<div id="toastContainer"></div>
<div class="install-banner" id="installBanner" style="display:none">
  <span style="font-size:28px">📅</span><span class="ib-text">添加到主屏幕，像App一样使用</span>
  <button class="ib-btn" id="btnInstall">添加</button>
</div>

<script>
// ============================================================
//  DATA LAYER
// ============================================================
const STORAGE_KEY='schedule_courses_v2';
const CONFIG_KEY='schedule_config_v2';
const DEFAULT_COLORS=['#4CAF50','#2196F3','#FF9800','#E91E63','#9C27B0','#00BCD4','#FF5722','#607D8B','#795548','#3F51B5'];

function loadCourses(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch(e){return[]}}
function saveCourses(c){localStorage.setItem(STORAGE_KEY,JSON.stringify(c))}
function loadConfig(){const d={scheduleName:'我的课程表'};try{return{...d,...JSON.parse(localStorage.getItem(CONFIG_KEY))}}catch(e){return d}}
function saveConfig(c){localStorage.setItem(CONFIG_KEY,JSON.stringify(c))}
function generateId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

// ============================================================
//  STATE
// ============================================================
let courses=loadCourses();
let config=loadConfig();
let currentWeekStart='';   // Monday of displayed week (YYYY-MM-DD)
let currentDayDate='';     // Date shown in day view
let currentView='week';
let editingId=null;
let deferredInstallPrompt=null;

// ============================================================
//  DATE UTILS
// ============================================================
function toDate(s){const p=s.split('-');return new Date(p[0],p[1]-1,p[2])}
function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(s,n){const d=toDate(s);d.setDate(d.getDate()+n);return dateStr(d)}
function dayOfWeek(s){return toDate(s).getDay()||7} // 1=Mon,7=Sun
function getMonday(s){
  const d=toDate(s);const dow=(d.getDay()||7);
  d.setDate(d.getDate()-dow+1);return dateStr(d);
}
function getToday(){return dateStr(new Date())}
function formatMD(s){const d=toDate(s);return (d.getMonth()+1)+'月'+d.getDate()+'日'}
function formatMDShort(s){const d=toDate(s);return (d.getMonth()+1)+'/'+d.getDate()}
function timeToMinutes(t){const[p,m]=t.split(':').map(Number);return p*60+m}
function sameDay(a,b){return a===b}

// ============================================================
//  COURSE FILTERING (with weekly repeat expansion)
// ============================================================
function getCoursesForDate(targetDate){
  const dow=dayOfWeek(targetDate);
  return courses.filter(c=>{
    // Direct match
    if(c.date===targetDate)return true;
    // Weekly repeat
    if(c.repeat==='weekly'&&c.repeatUntil){
      if(targetDate<c.date||targetDate>c.repeatUntil)return false;
      if(dayOfWeek(c.date)!==dow)return false;
      return true;
    }
    return false;
  }).sort((a,b)=>timeToMinutes(a.startTime)-timeToMinutes(b.startTime));
}

// Get all expanded dates for a course (for ICS export)
function getExpandedDates(course){
  const dates=[];
  if(course.repeat==='weekly'&&course.repeatUntil){
    let d=course.date;
    const end=course.repeatUntil;
    while(d<=end){
      dates.push(d);
      d=addDays(d,7);
    }
  }else{
    dates.push(course.date);
  }
  return dates;
}

// ============================================================
//  WEEK VIEW
// ============================================================
const DAY_NAMES=['周一','周二','周三','周四','周五','周六','周日'];

function renderWeekView(){
  const container=document.getElementById('weekView');
  const today=getToday();
  const dates=[];
  for(let i=0;i<7;i++)dates.push(addDays(currentWeekStart,i));
  const isThisWeek=dates.includes(today);

  // Build grid: 8:00-21:00, 5min steps = 156 rows
  let html='<div class="week-grid"><div class="time-label" style="grid-row:1"></div>';
  for(let i=0;i<7;i++){
    const cls=(dates[i]===today)?'day-label today':'day-label';
    html+=`<div class="${cls}">${DAY_NAMES[i]}<span>${formatMDShort(dates[i])}</span></div>`;
  }

  // Time rows: 8:00-20:55, 5min each
  for(let h=8;h<21;h++){
    for(let m=0;m<60;m+=5){
      const row=(h-8)*12+(m/5)+2; // header=1, first time row=2
      const ts=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      html+=`<div class="time-label" style="grid-row:${row}">${m===0?ts:''}</div>`;
      for(let d=0;d<7;d++){
        html+=`<div class="day-col" style="grid-row:${row}" data-date="${dates[d]}" data-time="${ts}"></div>`;
      }
    }
  }
  html+='</div>';
  container.innerHTML=html;

  // Course overlays per day
  const grid=container.querySelector('.week-grid');
  for(let d=0;d<7;d++){
    const dayCourses=getCoursesForDate(dates[d]);
    if(dayCourses.length===0)continue;
    const overlay=document.createElement('div');
    overlay.style.cssText='position:relative;grid-column:'+(d+2)+';grid-row:2/158;pointer-events:none;';
    dayCourses.forEach(course=>{
      const sm=timeToMinutes(course.startTime)-480;endM=timeToMinutes(course.endTime)-480;
      const top=sm/5*6,height=(endM-sm)/5*6;
      const block=document.createElement('div');
      block.className='course-block';
      block.style.cssText=`top:${top}px;height:${Math.max(height,10)}px;background:${course.color};pointer-events:auto;`;
      const detail=[course.student,course.location].filter(Boolean).join(' · ');
      const tuition=course.tuition?' ¥'+course.tuition:'';
      block.innerHTML=`<div class="c-name">${course.name}</div><div class="c-detail">${course.startTime}-${course.endTime} ${detail}</div><div class="c-tiny">${course.organization||''}${tuition}</div>`;
      block.addEventListener('click',(e)=>{e.stopPropagation();openEditModal(course.id)});
      overlay.appendChild(block);
    });
    grid.appendChild(overlay);
  }

  // Click on empty cell
  container.querySelectorAll('.day-col').forEach(cell=>{
    cell.addEventListener('click',()=>{openAddModal(cell.dataset.date,cell.dataset.time)});
  });
}

// ============================================================
//  DAY VIEW
// ============================================================
function renderDayView(){
  const container=document.getElementById('dayView');
  const courses=getCoursesForDate(currentDayDate);
  const today=getToday();
  const isToday=(currentDayDate===today);

  let html=`
    <div class="day-header">
      <button class="week-nav-btn" id="btnDayPrev">◀</button>
      <h2>${formatMD(currentDayDate)} ${DAY_NAMES[dayOfWeek(currentDayDate)-1]}${isToday?' <small style="color:var(--accent);font-size:12px">今天</small>':''}</h2>
      <button class="week-nav-btn" id="btnDayNext">▶</button>
    </div>
  `;

  if(courses.length===0){
    html+=`<div class="day-empty"><div class="empty-icon">📭</div><p>当天没有课程</p></div>`;
  }else{
    courses.forEach(c=>{
      const row=[c.student?`学生: ${c.student}`:'',c.location?`地点: ${c.location}`:'',c.organization?`机构: ${c.organization}`:''].filter(Boolean).join(' · ');
      html+=`
        <div class="day-card" style="--c:${c.color}" data-id="${c.id}">
          <div class="dc-time">${c.startTime} - ${c.endTime}</div>
          <div class="dc-name" style="color:${c.color}">${c.name}</div>
          ${row?`<div class="dc-info">${row}</div>`:''}
          ${c.tuition?`<div class="dc-tuition">💰 学费: ¥${c.tuition}</div>`:''}
          ${c.note?`<div class="dc-info" style="margin-top:2px">📌 ${c.note}</div>`:''}
          ${c.repeat==='weekly'?`<div class="dc-info" style="margin-top:2px;color:var(--accent)">🔁 每周重复 · 至${formatMD(c.repeatUntil)}</div>`:''}
        </div>
      `;
    });
  }
  container.innerHTML=html;
  container.querySelectorAll('.day-card').forEach(card=>{
    card.addEventListener('click',()=>openEditModal(card.dataset.id));
  });
  const dp=container.querySelector('#btnDayPrev');
  if(dp)dp.addEventListener('click',()=>{currentDayDate=addDays(currentDayDate,-1);renderDayView()});
  const dn=container.querySelector('#btnDayNext');
  if(dn)dn.addEventListener('click',()=>{currentDayDate=addDays(currentDayDate,1);renderDayView()});
}

// Day card left border
const dayCardStyle=document.createElement('style');
dayCardStyle.textContent='.day-card::before{background:var(--c)}';
document.head.appendChild(dayCardStyle);

// ============================================================
//  NAVIGATION
// ============================================================
function updateWeekNav(){
  const end=addDays(currentWeekStart,6);
  document.getElementById('weekInfo').textContent=formatMD(currentWeekStart)+' - '+formatMD(end);
}
function goWeek(delta){
  currentWeekStart=addDays(currentWeekStart,delta*7);
  updateWeekNav();
  if(currentView==='week')renderWeekView();
  else{currentDayDate=currentWeekStart;renderDayView();}
}
function goToday(){
  currentWeekStart=getMonday(getToday());
  currentDayDate=getToday();
  updateWeekNav();
  if(currentView==='week')renderWeekView();
  else renderDayView();
}
function switchView(view){
  currentView=view;
  document.getElementById('weekView').classList.toggle('active',view==='week');
  document.getElementById('dayView').classList.toggle('active',view==='day');
  document.querySelectorAll('#viewToggle button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  if(view==='day')currentDayDate=currentWeekStart;
  if(view==='week')renderWeekView();
  else renderDayView();
}

// ============================================================
//  COURSE MODAL
// ============================================================
function openAddModal(date,time){
  editingId=null;
  document.getElementById('modalTitle').textContent='添加课程';
  document.getElementById('btnDelete').style.display='none';
  document.getElementById('courseId').value='';
  document.getElementById('cName').value='';document.getElementById('cStudent').value='';
  document.getElementById('cLocation').value='';document.getElementById('cOrg').value='';
  document.getElementById('cTuition').value='';document.getElementById('cNote').value='';
  document.getElementById('cDate').value=date||getToday();
  document.getElementById('cStart').value=time||'09:00';document.getElementById('cEnd').value='10:00';
  document.getElementById('cColor').value='#4CAF50';
  document.getElementById('cRepeat').value='none';document.getElementById('cRepeatUntil').value='';
  document.getElementById('repeatUntilGroup').style.display='none';
  updateColorPicker();
  document.getElementById('courseModal').style.display='flex';
}
function openEditModal(id){
  const c=courses.find(x=>x.id===id);if(!c)return;
  editingId=id;
  document.getElementById('modalTitle').textContent='编辑课程';
  document.getElementById('btnDelete').style.display='block';
  document.getElementById('courseId').value=c.id;
  document.getElementById('cName').value=c.name;document.getElementById('cStudent').value=c.student||'';
  document.getElementById('cLocation').value=c.location||'';document.getElementById('cOrg').value=c.organization||'';
  document.getElementById('cTuition').value=c.tuition||'';document.getElementById('cNote').value=c.note||'';
  document.getElementById('cDate').value=c.date;
  document.getElementById('cStart').value=c.startTime;document.getElementById('cEnd').value=c.endTime;
  document.getElementById('cColor').value=c.color;
  document.getElementById('cRepeat').value=c.repeat||'none';
  document.getElementById('cRepeatUntil').value=c.repeatUntil||'';
  document.getElementById('repeatUntilGroup').style.display=c.repeat==='weekly'?'block':'none';
  updateColorPicker();
  document.getElementById('courseModal').style.display='flex';
}
function closeModal(){document.getElementById('courseModal').style.display='none'}

function saveCourse(){
  const name=document.getElementById('cName').value.trim();
  if(!name){toast('请输入课程名称');return}
  const student=document.getElementById('cStudent').value.trim();
  if(!student){toast('请输入学生姓名');return}
  const tuition=parseFloat(document.getElementById('cTuition').value);
  if(isNaN(tuition)||tuition<0){toast('请输入有效的学费金额');return}
  const startTime=document.getElementById('cStart').value;
  const endTime=document.getElementById('cEnd').value;
  if(timeToMinutes(endTime)<=timeToMinutes(startTime)){toast('结束时间必须晚于开始时间');return}
  const repeat=document.getElementById('cRepeat').value;
  const repeatUntil=document.getElementById('cRepeatUntil').value;
  if(repeat==='weekly'&&!repeatUntil){toast('请选择重复截止日期');return}
  if(repeat==='weekly'&&repeatUntil<document.getElementById('cDate').value){toast('截止日期不能早于上课日期');return}

  const course={
    id:editingId||generateId(),
    name,student,
    location:document.getElementById('cLocation').value.trim(),
    organization:document.getElementById('cOrg').value.trim(),
    tuition,
    date:document.getElementById('cDate').value,
    startTime,endTime,
    color:document.getElementById('cColor').value,
    repeat,repeatUntil:repeat==='weekly'?repeatUntil:'',
    note:document.getElementById('cNote').value.trim()
  };

  if(editingId){courses=courses.map(x=>x.id===editingId?course:x)}
  else{courses.push(course)}
  saveCourses(courses);closeModal();
  if(currentView==='week')renderWeekView();else renderDayView();
  toast(editingId?'课程已更新':'课程已添加');
}
function deleteCourse(){
  if(!editingId)return;
  if(!confirm('确定删除这门课程吗？此操作不可撤销。'))return;
  courses=courses.filter(x=>x.id!==editingId);
  saveCourses(courses);closeModal();
  if(currentView==='week')renderWeekView();else renderDayView();
  toast('课程已删除');
}

// ============================================================
//  ICS EXPORT
// ============================================================
function escapeICS(s){return(s||'').replace(/[\\;,]/g,'\\$&').replace(/\n/g,'\\n')}
function formatICSDate(d,t){
  const[p,m]=t.split(':');const dt=new Date(d+'T00:00:00');
  dt.setHours(parseInt(p),parseInt(m),0,0);
  return dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
}
function generateICS(){
  let ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TeacherSchedule//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+escapeICS(config.scheduleName)];

  courses.forEach(c=>{
    const dates=getExpandedDates(c);
    dates.forEach(d=>{
      const dtStart=formatICSDate(d,c.startTime),dtEnd=formatICSDate(d,c.endTime);
      const summary='📚 '+c.name+' ('+c.student+')';
      const location=[c.location,c.organization].filter(Boolean).join(' / ');
      const desc=['学生: '+c.student,'地点: '+(c.location||'未指定'),'机构: '+(c.organization||'未指定'),'学费: ¥'+c.tuition,c.note].filter(Boolean).join('\\n');

      ics.push('BEGIN:VEVENT',`DTSTART:${dtStart}`,`DTEND:${dtEnd}`,`SUMMARY:${escapeICS(summary)}`);
      if(location)ics.push(`LOCATION:${escapeICS(location)}`);
      ics.push(`DESCRIPTION:${escapeICS(desc)}`);
      ics.push('BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY',`DESCRIPTION:${escapeICS('课程提醒: '+c.name+' 将在1小时后开始')}`,'END:VALARM','END:VEVENT');
    });
  });
  ics.push('END:VCALENDAR');
  return ics.join('\r\n');
}
function exportICS(){
  if(courses.length===0){toast('还没有课程，请先添加');return}
  const ics=generateICS();const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const filename=`${config.scheduleName}.ics`;
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([blob],filename,{type:'text/calendar'})]})){
    navigator.share({files:[new File([blob],filename,{type:'text/calendar'})]}).catch(()=>fallbackDL());
  }else{fallbackDL()}
  function fallbackDL(){
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  toast('📥 日历文件已生成！\n在 Safari 中打开即可导入');
}

// ============================================================
//  SETTINGS
// ============================================================
function openSettings(){
  document.getElementById('sName').value=config.scheduleName;
  document.getElementById('settingsModal').style.display='flex';
}
function closeSettings(){document.getElementById('settingsModal').style.display='none'}
function saveSettingsCfg(){
  config.scheduleName=document.getElementById('sName').value.trim()||'我的课程表';
  saveConfig(config);closeSettings();toast('设置已保存');
}
function exportData(){
  const data={courses,config,version:2};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='课程表备份.json';document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);toast('数据已导出');
}
function importData(){document.getElementById('importFile').click()}
function handleImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.courses){throw new Error('Invalid format')}
      courses=data.courses;config=data.config||{scheduleName:'我的课程表'};
      saveCourses(courses);saveConfig(config);
      if(currentView==='week')renderWeekView();else renderDayView();
      toast(`已导入 ${courses.length} 门课程`);
    }catch(err){toast('导入失败：文件格式不正确')}
  };
  reader.readAsText(file);e.target.value='';
}
function clearAll(){
  if(!confirm('确定要清空所有课程数据吗？\n建议先导出一份备份。\n此操作不可撤销！'))return;
  courses=[];saveCourses(courses);
  if(currentView==='week')renderWeekView();else renderDayView();
  toast('所有数据已清��');
}

// ============================================================
//  COLOR PICKER
// ============================================================
function updateColorPicker(){
  const picker=document.getElementById('colorPicker'),selected=document.getElementById('cColor').value;
  picker.innerHTML=DEFAULT_COLORS.map(c=>`<div class="color-dot${c===selected?' selected':''}" style="background:${c}" data-color="${c}"></div>`).join('');
  picker.querySelectorAll('.color-dot').forEach(dot=>{
    dot.addEventListener('click',()=>{document.getElementById('cColor').value=dot.dataset.color;updateColorPicker()});
  });
}

// ============================================================
//  TIME SELECTORS (5-minute steps, 6:00-22:00)
// ============================================================
function populateTimeSelectors(){
  const times=[];
  for(let h=6;h<22;h++){for(let m=0;m<60;m+=5){times.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'))}}
  times.push('22:00');
  const opts=times.map(t=>`<option value="${t}">${t}</option>`).join('');
  document.getElementById('cStart').innerHTML=opts;
  document.getElementById('cEnd').innerHTML=opts;
  document.getElementById('cStart').value='09:00';
  document.getElementById('cEnd').value='10:00';
}

// ============================================================

document.getElementById('btnNext').addEventListener('click',()=>goWeek(1));
document.getElementById('btnToday').addEventListener('click',goToday);

document.getElementById('btnCancel').addEventListener('click',closeModal);

document.getElementById('btnDelete').addEventListener('click',deleteCourse);

// Repeat toggle
document.getElementById('cRepeat').addEventListener('change',function(){
  document.getElementById('repeatUntilGroup').style.display=this.value==='weekly'?'block':'none';

// Install banner
document.getElementById('btnInstall').addEventListener('click',()=>{

});

function toast(msg){const c=document.getElementById('toastContainer');const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2300)}
