<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="课程表">
<meta name="theme-color" content="#1d1d1f">
<meta name="description" content="教师课程表">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%234CAF50'/><text x='90' y='115' text-anchor='middle' font-size='100' font-family='sans-serif'>📅</text></svg>">
<title>课程表</title>
<style>
:root{
  --bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--text2:#6e6e73;--text3:#aeaeb2;
  --border:#e5e5ea;--accent:#4CAF50;--accent-hover:#43a047;--danger:#ff3b30;
  --warning:#ff9500;--blue:#007aff;--shadow:0 2px 12px rgba(0,0,0,.08);
  --radius:14px;--radius-sm:10px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --tab-h:calc(56px + var(--safe-bottom));
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  background:var(--bg);background-size:cover;background-position:center;background-repeat:no-repeat;
  color:var(--text);height:100%;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  transition:background-image .5s;
}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--text)}
select{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;width:100%}
input[type=time],input[type=date]{min-height:44px}
#app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top)+6px) 16px 6px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.header h1{font-size:18px;font-weight:700}
.btn-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.btn-icon:active{background:var(--border)}
.btn-sm{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:600;background:var(--accent);color:#fff}
.btn-sm-outline{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:600;border:1.5px solid var(--border);color:var(--text)}
.week-nav{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;background:var(--surface);flex-shrink:0;border-bottom:1px solid var(--border)}
.week-nav-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--bg)}
.week-nav-btn:active{background:var(--border)}
.week-nav-info{font-size:13px;font-weight:600;text-align:center;min-width:160px}
.btn-today{font-size:11px;padding:4px 10px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}
.view-toggle{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.view-toggle button{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2);transition:all .2s}
.view-toggle button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--tab-h)+10px)}
.page{display:none}.page.active{display:block}

/* Schedule */
#weekView{padding:4px 4px 20px}
.week-grid{display:grid;grid-template-columns:44px repeat(7,1fr)}
.day-label{background:var(--surface);text-align:center;padding:6px 2px;font-size:10px;font-weight:600;border-bottom:2px solid var(--border);line-height:1.3}
.day-label span{display:block;font-size:9px;color:var(--text2);font-weight:400}
.day-label.today{border-bottom-color:var(--accent);color:var(--accent)}.day-label.today span{color:var(--accent)}
.time-label{font-size:8px;color:var(--text3);text-align:right;padding:0 3px 0 0;height:6px;line-height:6px}
.day-col{position:relative;min-height:6px}
.course-block{position:absolute;left:1px;right:1px;border-radius:4px;padding:2px 3px;font-size:9px;line-height:1.2;overflow:hidden;cursor:pointer;color:#fff;font-weight:600;z-index:2;border-left:2px solid rgba(255,255,255,.3)}
.course-block.warn{border:1.5px dashed #ff9500;box-shadow:0 0 6px rgba(255,149,0,.4)}
.course-block:active{transform:scale(.97)}
.course-block .c-name{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-block .c-detail{font-size:7px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Day view */
#dayView{padding:8px 12px 20px}
.day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.day-header h2{font-size:17px;font-weight:700}
.day-card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.day-card.warn{box-shadow:0 0 0 2px var(--warning),0 0 12px rgba(255,149,0,.25)}
.day-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.day-card .dc-time{font-size:14px;font-weight:700;margin-bottom:4px}
.day-card .dc-name{font-size:16px;font-weight:600;margin-bottom:3px}
.day-card .dc-info{font-size:12px;color:var(--text2);margin-bottom:1px}
.day-card .dc-tuition{font-size:12px;font-weight:600;color:#e65100}
.day-card .dc-badges{position:absolute;right:8px;top:8px;display:flex;gap:4px;flex-direction:column;align-items:flex-end}
.day-card .dc-badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:700}
.day-card .dc-badge.green{background:#e8f5e9;color:#2e7d32}
.day-card .dc-badge.red{background:#fce4ec;color:#c62828}
.day-card .dc-badge.orange{background:#fff3e0;color:#e65100}
.day-card .dc-marks{display:flex;gap:8px;margin-top:6px}
.day-card .dc-mark{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg);display:flex;align-items:center;gap:3px;cursor:pointer}
.day-card .dc-mark.done{background:#e8f5e9;color:#2e7d32}
.day-card .dc-mark.warn{background:#fff3e0;color:#e65100;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.day-empty{text-align:center;padding:60px 20px;color:var(--text3)}
.day-empty .empty-icon{font-size:48px;margin-bottom:12px}

/* Footer & Tab Bar */
.schedule-footer{display:flex;gap:10px;padding:8px 16px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.tab-bar{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:var(--safe-bottom)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 0 3px;font-size:9px;color:var(--text3);transition:color .15s}
.tab-item .tab-icon{font-size:18px;margin-bottom:1px}
.tab-item.active{color:var(--accent)}

/* List cards */
.list-item{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin:6px 12px;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:pointer;display:flex;align-items:center;gap:12px}
.list-item .li-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.list-item .li-info{flex:1;min-width:0}
.list-item .li-name{font-size:15px;font-weight:600}
.list-item .li-sub{font-size:12px;color:var(--text2);margin-top:2px}
.list-item .li-arrow{color:var(--text3);font-size:14px}
.list-item .li-tag{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600;display:inline-block;margin-left:4px}
.list-item .li-tag.prepaid{background:#e3f2fd;color:#1565c0}
.list-item .li-tag.postpaid{background:#fff3e0;color:#e65100}
.section-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.section-hd h3{font-size:14px;font-weight:700}
.empty-state{text-align:center;padding:50px 20px;color:var(--text3);font-size:13px;line-height:1.8}

/* Salary */
.salary-section{margin:12px 16px}
.salary-section h3{font-size:15px;font-weight:700;margin-bottom:8px}
.salary-row{display:flex;justify-content:space-between;padding:10px 14px;background:var(--surface);border-radius:var(--radius-sm);margin:4px 0;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.salary-row .sr-label{font-weight:600}.salary-row .sr-val{font-weight:700}
.salary-row .sr-val.green{color:#2e7d32}.salary-row .sr-val.red{color:#c62828}.salary-row .sr-val.orange{color:#e65100}
.salary-sub{font-size:11px;color:var(--text2)}
.prepaid-bar{margin:8px 0;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.prepaid-bar .pb-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.prepaid-bar .pb-fill.low{background:var(--warning)}.prepaid-bar .pb-fill.empty{background:var(--danger)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);width:100%;max-width:600px;max-height:90vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideUp .25s;padding-bottom:var(--safe-bottom)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:17px;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px}
.modal-footer{display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--border)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg)}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);outline:none}
.form-row{display:flex;gap:10px}.form-row .form-group{flex:1}
.req{color:var(--danger)}.hint{font-size:10px;color:var(--text2);margin-top:3px}
.repeat-row{padding:10px 14px;background:var(--bg);border-radius:var(--radius-sm);margin:8px 0}
.color-picker{display:flex;gap:6px;flex-wrap:wrap}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color-dot.selected{border-color:var(--text);box-shadow:0 0 0 3px rgba(0,0,0,.1)}
.btn-primary{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;background:var(--accent);color:#fff;text-align:center}
.btn-secondary{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;background:var(--bg);color:var(--text);text-align:center}
.btn-danger{color:var(--danger);font-weight:600;font-size:14px}
.btn-save{padding:10px 28px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;background:var(--accent);color:#fff}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;white-space:nowrap;animation:toastIn .3s,toastOut .3s 2s forwards;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
.course-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.course-chip{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;color:#fff;cursor:pointer}
.export-preview{background:var(--bg);border-radius:var(--radius-sm);padding:14px;font-size:12px;line-height:1.8;white-space:pre-wrap;max-height:60vh;overflow-y:auto;margin-top:10px;font-family:monospace}
.install-banner{position:fixed;bottom:100px;left:16px;right:16px;z-index:90;background:var(--surface);border-radius:var(--radius);padding:14px 18px;box-shadow:0 4px 24px rgba(0,0,0,.15);display:flex;align-items:center;gap:12px;animation:slideUp .3s}
.install-banner .ib-text{flex:1;font-size:13px;font-weight:600}
.install-banner .ib-btn{padding:8px 16px;border-radius:16px;background:var(--accent);color:#fff;font-size:13px;font-weight:600}
.search-bar{padding:8px 12px}
.search-bar input{width:100%;padding:10px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-size:14px}
#importFile{display:none}
</style>
</head>
<body>
<div id="app">
  <header class="header" id="mainHeader">
    <h1 id="headerTitle">📅 课程表</h1>
    <div class="header-actions" id="headerActions"><div class="view-toggle" id="viewToggle"><button data-view="week" class="active">周</button><button data-view="day">日</button></div></div>
  </header>
  <nav class="week-nav" id="weekNav">
    <button class="week-nav-btn" id="btnPrev">◀</button><div class="week-nav-info" id="weekInfo">加载中...</div><button class="week-nav-btn" id="btnNext">▶</button><button class="btn-today" id="btnToday">今天</button>
  </nav>
  <main class="main-content" id="mainContent">
    <div id="pageSchedule" class="page active"><div id="weekView"></div><div id="dayView" style="display:none"></div></div>
    <div id="pageStudents" class="page"><div class="section-hd"><h3>学生列表</h3><button class="btn-sm" id="btnAddStudent">+ 添加</button></div><div class="search-bar"><input type="text" id="studentSearch" placeholder="搜索学生..."></div><div id="studentList"></div><div id="studentDetail" style="display:none"><div class="section-hd"><button class="btn-sm-outline" id="btnStudentBack">← 返回</button><div style="display:flex;gap:6px"><button class="btn-sm-outline" id="btnStudentExport">📤 导出</button><button class="btn-sm" id="btnStudentEdit">编辑</button></div></div><div id="studentDetailContent"></div></div></div>
    <div id="pageOrgs" class="page"><div class="section-hd"><h3>机构列表</h3><button class="btn-sm" id="btnAddOrg">+ 添加</button></div><div class="search-bar"><input type="text" id="orgSearch" placeholder="搜索机构..."></div><div id="orgList"></div><div id="orgDetail" style="display:none"><div class="section-hd"><button class="btn-sm-outline" id="btnOrgBack">← 返回</button><button class="btn-sm" id="btnOrgEdit">编辑</button></div><div id="orgDetailContent"></div></div></div>
    <div id="pageSalary" class="page"><div class="section-hd"><h3>💰 工资汇总</h3></div><div id="salaryContent"></div></div>
    <div id="pageSettings" class="page"><div style="padding:12px 16px"><div class="form-group"><label>课程表名称</label><input type="text" id="sName"></div><div class="form-group"><label>背景图（可选）</label><input type="file" id="bgFile" accept="image/*" style="padding:8px 0;border:none;background:none"><span class="hint" id="bgStatus"></span><button class="btn-sm-outline" id="btnRemoveBg" style="margin-top:4px;display:none">移除</button></div><button class="btn-primary" id="btnSaveSettingsCfg" style="width:100%;margin-bottom:20px">保存设置</button><h3 style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">数据管理</h3><div style="background:var(--bg);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:10px"><button class="btn-primary" id="btnExportDataS" style="width:100%;background:var(--bg);color:var(--text);margin-bottom:1px;border-radius:0">📤 导出全部数据 (JSON)</button><button class="btn-primary" id="btnImportDataS" style="width:100%;background:var(--bg);color:var(--text);margin-bottom:1px;border-radius:0">📥 导入数据恢复 (JSON)</button><button class="btn-primary" id="btnClearAllS" style="width:100%;background:var(--bg);color:var(--danger);border-radius:0">🗑 清空所有数据</button></div><input type="file" id="importFile" accept=".json"></div></div>
  </main>
  <div class="schedule-footer" id="scheduleFooter"><button class="btn-primary" id="btnAddCourse">+ 添加课程</button><button class="btn-secondary" id="btnExport">📥 导出日历</button></div>
  <nav class="tab-bar" id="tabBar">
    <button class="tab-item active" data-tab="schedule"><span class="tab-icon">📅</span>课程表</button>
    <button class="tab-item" data-tab="students"><span class="tab-icon">👨‍🎓</span>学生</button>
    <button class="tab-item" data-tab="orgs"><span class="tab-icon">🏢</span>机构</button>
    <button class="tab-item" data-tab="salary"><span class="tab-icon">💰</span>工资</button>
    <button class="tab-item" data-tab="settings"><span class="tab-icon">⚙</span>设置</button>
  </nav>
</div>

<!-- COURSE MODAL -->
<div class="modal-overlay" id="courseModal" style="display:none"><div class="modal"><div class="modal-header"><h2 id="modalTitle">添加课程</h2><button class="btn-icon" id="btnCloseModal">✕</button></div><div class="modal-body"><input type="hidden" id="courseId"><div class="form-group"><label>课程名称 <span class="req">*</span></label><input type="text" id="cName"></div><div class="form-row"><div class="form-group"><label>学生 <span class="req">*</span></label><select id="cStudentId"></select></div><div class="form-group"><label>机构</label><select id="cOrgId"><option value="">暂不选择</option></select></div></div><div class="form-row"><div class="form-group"><label>上课地点</label><input type="text" id="cLocation"></div><div class="form-group"><label>课费 (RMB) <span class="req">*</span></label><input type="number" id="cTuition" min="0" step="0.01"></div></div><div class="form-row"><div class="form-group"><label>上课日期 <span class="req">*</span></label><input type="date" id="cDate"></div><div class="form-group"><label>颜色</label><div class="color-picker" id="colorPicker"></div><input type="hidden" id="cColor" value="#4CAF50"></div></div><div class="form-row"><div class="form-group"><label>开始时间 <span class="req">*</span></label><input type="time" id="cStart" step="300" value="09:00"></div><div class="form-group"><label>结束时间 <span class="req">*</span></label><input type="time" id="cEnd" step="300" value="10:00"></div></div><div class="repeat-row"><div class="form-group"><label>重复模式</label><select id="cRepeat"><option value="none">不重复</option><option value="weekly">每周重复</option></select></div><div class="form-group" id="repeatUntilGroup" style="display:none;margin-top:8px"><label>截止日期 <span class="req">*</span></label><input type="date" id="cRepeatUntil"><div class="hint">从上课日期起每周重复至截止日期</div></div></div><div class="form-group"><label>备注</label><input type="text" id="cNote"></div></div><div class="modal-footer"><button class="btn-danger" id="btnDelete" style="display:none">删除课程</button><div style="flex:1"></div><button class="btn-secondary" id="btnCancel">取消</button><button class="btn-save" id="btnSave">保存</button></div></div></div>

<!-- STUDENT MODAL -->
<div class="modal-overlay" id="studentModal" style="display:none"><div class="modal"><div class="modal-header"><h2 id="studentModalTitle">添加学生</h2><button class="btn-icon" id="btnCloseStudentModal">✕</button></div><div class="modal-body"><input type="hidden" id="studentId"><div class="form-group"><label>姓名 <span class="req">*</span></label><input type="text" id="sNameI"></div><div class="form-row"><div class="form-group"><label>年龄</label><input type="number" id="sAge" min="1" max="120"></div><div class="form-group"><label>学习基础</label><input type="text" id="sLevel" placeholder="如：零基础"></div></div><div class="form-group"><label>所属机构</label><select id="sOrgId"><option value="">无</option></select></div><div class="form-group"><label>默认课费 (RMB)</label><input type="number" id="sDefTuition" min="0" step="0.01" placeholder="0"><div class="hint">添加课程时自动填入此金额（可修改），0表示不自动填充</div></div><div class="form-group"><label>付费模式</label><select id="sPaymentMode"><option value="postpaid">后付费（先上课后付）</option><option value="prepaid">预付费（先付后上课）</option></select></div><div id="sPrepaidGroup" style="display:none"><div class="form-row"><div class="form-group"><label>预付费金额 (RMB)</label><input type="number" id="sPrepaidAmt" min="0" step="0.01"></div><div class="form-group"><label>预付费日期</label><input type="date" id="sPrepaidDate"></div></div></div></div><div class="modal-footer"><button class="btn-danger" id="btnDeleteStudent" style="display:none">删除学生</button><div style="flex:1"></div><button class="btn-secondary" id="btnCancelStudent">取消</button><button class="btn-save" id="btnSaveStudent">保存</button></div></div></div>

<!-- ORG MODAL -->
<div class="modal-overlay" id="orgModal" style="display:none"><div class="modal"><div class="modal-header"><h2 id="orgModalTitle">添加机构</h2><button class="btn-icon" id="btnCloseOrgModal">✕</button></div><div class="modal-body"><input type="hidden" id="orgId"><div class="form-group"><label>名称 <span class="req">*</span></label><input type="text" id="oNameI"></div><div class="form-row"><div class="form-group"><label>位置</label><input type="text" id="oLocation"></div><div class="form-group"><label>校区</label><input type="text" id="oCampus"></div></div></div><div class="modal-footer"><button class="btn-danger" id="btnDeleteOrg" style="display:none">删除机构</button><div style="flex:1"></div><button class="btn-secondary" id="btnCancelOrg">取消</button><button class="btn-save" id="btnSaveOrg">保存</button></div></div></div>

<!-- EXPORT MODAL -->
<div class="modal-overlay" id="exportModal" style="display:none"><div class="modal"><div class="modal-header"><h2>导出学生课程</h2><button class="btn-icon" id="btnCloseExport">✕</button></div><div class="modal-body"><div class="form-row"><div class="form-group"><label>起始日期</label><input type="date" id="expStart"></div><div class="form-group"><label>结束日期</label><input type="date" id="expEnd"></div></div><div class="export-preview" id="exportPreview"></div></div><div class="modal-footer"><button class="btn-secondary" id="btnCopyExport">📋 复制</button><button class="btn-save" id="btnShareExport">📤 分享</button></div></div></div>

<div id="toastContainer"></div>
<div class="install-banner" id="installBanner" style="display:none"><span style="font-size:28px">📅</span><span class="ib-text">添加到主屏幕，像App一样使用</span><button class="ib-btn" id="btnInstall">添加</button></div>

<script>
// DATA
const A='_v4',KC='schedule_courses'+A,KS='schedule_students'+A,KO='schedule_orgs'+A,KF='schedule_config'+A;
const DC=['#4CAF50','#2196F3','#FF9800','#E91E63','#9C27B0','#00BCD4','#FF5722','#607D8B','#795548','#3F51B5'];
const DN=['周一','周二','周三','周四','周五','周六','周日'],D=document;
function L(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v===null||v===undefined?d:v}catch(e){return d}}
function S(k,v){localStorage.setItem(k,JSON.stringify(v))}
function G(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
let courses=L(KC,[]),students=L(KS,[]),orgs=L(KO,[]),config=L(KF,{scheduleName:'我的课程表',bgImage:''});

// DATE UTILS
function td(s){if(!s||typeof s!=='string')return new Date();const p=s.split('-');if(p.length!==3||isNaN(+p[0]))return new Date();return new Date(+p[0],+p[1]-1,+p[2])}
function ds(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ad(s,n){const d=td(s||ds());d.setDate(d.getDate()+(+n||0));return ds(d)}
function dow(s){return td(s).getDay()||7}
function monday(s){const d=td(s||ds());d.setDate(d.getDate()-(d.getDay()||7)+1);return ds(d)}
function today(){return ds(new Date())}
function md(s){const d=td(s);return (d.getMonth()+1)+'月'+d.getDate()+'日'}
function ms(s){const d=td(s);return (d.getMonth()+1)+'/'+d.getDate()}
function tm(t){const[p,m]=t.split(':').map(Number);return p*60+m}

// COURSE UTILS
function getForDate(d){return courses.filter(c=>{if(c.date===d)return true;if(c.repeat==='weekly'&&c.repeatUntil&&d>=c.date&&d<=c.repeatUntil&&dow(c.date)===dow(d))return true;return false}).sort((a,b)=>tm(a.startTime)-tm(b.startTime))}
function expanded(c){const d=[];if(c.repeat==='weekly'&&c.repeatUntil){let t=c.date;while(t<=c.repeatUntil){d.push(t);t=ad(t,7)}}else d.push(c.date);return d}
function sn(id){const s=students.find(x=>x.id===id);return s?s.name:''}
function on(id){const o=orgs.find(x=>x.id===id);return o?o.name+(o.campus?' - '+o.campus:''):''}
function getStudent(id){return students.find(x=>x.id===id)||null}

// PREPAID BALANCE
function prepaidBalance(sid){
  const s=getStudent(sid);if(!s||s.paymentMode!=='prepaid'||!s.prepaidAmount)return s?{total:s.prepaidAmount,used:0,remaining:s.prepaidAmount}:null;
  let used=0;courses.forEach(c=>{if(c.studentId!==sid)return;const dates=expanded(c);dates.forEach(d=>{if(d>=s.prepaidDate){const m=c.marks&&c.marks[d];if(m&&m.completed)used+=c.tuition||0}})});
  return {total:s.prepaidAmount,used,remaining:Math.max(0,s.prepaidAmount-used)};
}
function isAutoPaid(course,date){
  const s=getStudent(course.studentId);if(!s||s.paymentMode!=='prepaid')return false;
  const bal=prepaidBalance(course.studentId);return bal&&bal.remaining>=(course.tuition||0);
}

// STATE
let cws=monday(today()),cdd=today(),cv='week',tab='schedule';
let eid=null,seid=null,oeid=null,exid=null,dip=null;

// TAB
function swt(t){
  tab=t;D.querySelectorAll('.tab-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  ['Schedule','Students','Orgs','Salary','Settings'].forEach(p=>D.getElementById('page'+p).classList.toggle('active',p.toLowerCase()===t));
  D.getElementById('weekNav').style.display=t==='schedule'?'flex':'none';
  D.getElementById('scheduleFooter').style.display=t==='schedule'?'flex':'none';
  D.getElementById('viewToggle').style.display=t==='schedule'?'':'none';
  D.getElementById('headerTitle').textContent={schedule:'📅 课程表',students:'👨‍🎓 学生管理',orgs:'🏢 机构管理',salary:'💰 工资汇总',settings:'⚙ 设置'}[t];
  if(t==='schedule'){if(cv==='week')rwv();else rdv()}
  else if(t==='students')rsl();else if(t==='orgs')rol();else if(t==='salary')rss();else rst();
}

// WEEK VIEW
function rwv(){const c=D.getElementById('weekView'),tod=today();const dates=[];for(let i=0;i<7;i++)dates.push(ad(cws,i));
  let h='<div class="week-grid"><div class="time-label" style="grid-row:1"></div>';
  for(let i=0;i<7;i++){const cl=(dates[i]===tod)?'day-label today':'day-label';h+=`<div class="${cl}">${DN[i]}<span>${ms(dates[i])}</span></div>`}
  for(let hh=8;hh<21;hh++)for(let m=0;m<60;m+=5){const row=(hh-8)*12+(m/5)+2,ts=String(hh).padStart(2,'0')+':'+String(m).padStart(2,'0');h+=`<div class="time-label" style="grid-row:${row}">${m===0?ts:''}</div>`;for(let d=0;d<7;d++)h+=`<div class="day-col" style="grid-row:${row}" data-date="${dates[d]}" data-time="${ts}"></div>`}
  h+='</div>';c.innerHTML=h;const grid=c.querySelector('.week-grid');
  const now=new Date();
  for(let d=0;d<7;d++){const dc=getForDate(dates[d]);if(!dc.length)continue;const o=document.createElement('div');o.style.cssText='position:relative;grid-column:'+(d+2)+';grid-row:2/158;pointer-events:none;';
    dc.forEach(co=>{const sm=tm(co.startTime)-480,em=tm(co.endTime)-480;const top=sm/5*6,ht=Math.max((em-sm)/5*6,10);
      const mk=co.marks&&co.marks[dates[d]]?co.marks[dates[d]]:null;
      const endDt=new Date(dates[d]+'T00:00:00');endDt.setHours(+co.endTime.split(':')[0],+co.endTime.split(':')[1],0,0);
      const needed=(now>endDt&&(!mk||!mk.completed));
      const bl=document.createElement('div');bl.className='course-block'+(needed?' warn':'');
      bl.style.cssText=`top:${top}px;height:${ht}px;background:${co.color};pointer-events:auto;`;
      const studentName=sn(co.studentId);const icons=(mk?(mk.completed?'✅':'')+(mk.paid?'💰':''):'');
      bl.innerHTML=`<div class="c-name">${co.name}${icons?' '+icons:''}${needed?' ⚠':''}</div><div class="c-detail">${co.startTime}-${co.endTime} ${studentName}${co.location?' · '+co.location:''}</div>`;
      bl.addEventListener('click',(e)=>{e.stopPropagation();oem(co.id)});o.appendChild(bl);
    });grid.appendChild(o);
  }
  c.querySelectorAll('.day-col').forEach(cell=>{cell.addEventListener('click',()=>{oam(cell.dataset.date,cell.dataset.time)})});
}

// DAY VIEW
function rdv(){const c=D.getElementById('dayView'),tod=today(),dc=getForDate(cdd);
  let h=`<div class="day-header"><button class="week-nav-btn" id="btnDayPrev">◀</button><h2>${md(cdd)} ${DN[dow(cdd)-1]}${cdd===tod?' <small style="color:var(--accent)">今天</small>':''}</h2><button class="week-nav-btn" id="btnDayNext">▶</button></div>`;
  if(!dc.length)h+=`<div class="day-empty"><div class="empty-icon">📭</div>当天没有课程</div>`;
  else{const now=new Date();dc.forEach(co=>{
    const snm=sn(co.studentId),onm=on(co.organizationId);
    const ep=co.endTime.split(':');const endDt=new Date(cdd+'T00:00:00');endDt.setHours(+ep[0],+ep[1],0,0);
    const canEdit=now>endDt;const mk=co.marks&&co.marks[cdd]?co.marks[cdd]:{completed:false,paid:false};
    const needed=now>endDt&&!mk.completed;
    const paid=canEdit?mk.paid:isAutoPaid(co,cdd);
    h+=`<div class="day-card${needed?' warn':''}" style="--c:${co.color}" data-id="${co.id}" data-date="${cdd}">
      <div class="dc-badges">
        <span class="dc-badge ${mk.completed?'green':'orange'}">${mk.completed?'✅ 已完成':'⚠ 未完成'}</span>
        <span class="dc-badge ${paid?'green':'red'}">${paid?'💰 已收':'🔴 未收'}</span>
      </div>
      <div class="dc-time">${co.startTime} - ${co.endTime}</div>
      <div class="dc-name" style="color:${co.color}">${co.name}</div>
      ${snm?`<div class="dc-info">👤 ${snm}${co.location?' · 📍'+co.location:''}</div>`:''}
      ${onm?`<div class="dc-info">🏢 ${onm}</div>`:''}
      ${co.tuition?`<div class="dc-tuition">💰 ¥${co.tuition}</div>`:''}
      ${co.note?`<div class="dc-info">📌 ${co.note}</div>`:''}
      <div class="dc-marks">
        <span class="dc-mark ${mk.completed?'done':(needed?'warn':'')}" data-action="toggleComplete" data-id="${co.id}" data-date="${cdd}" style="${canEdit?'':'opacity:.5;pointer-events:none'}">${mk.completed?'✅':'⬜'} ${mk.completed?'已完成':'未完成'}${needed?' 🔔':''}</span>
        <span class="dc-mark ${paid?'done':(canEdit?'':'')}" data-action="togglePaid" data-id="${co.id}" data-date="${cdd}" style="${canEdit?'':'opacity:.5;pointer-events:none'}">${paid?'💰':'⬜'} ${paid?'已收':'未收'}${!canEdit&&paid?' (自动)':''}</span>
      </div>
    </div>`});
  }
  c.innerHTML=h;
  c.querySelectorAll('.day-card').forEach(card=>{card.addEventListener('click',e=>{if(!e.target.closest('.dc-mark'))oem(card.dataset.id)})});
  c.querySelectorAll('.dc-mark').forEach(mark=>{mark.addEventListener('click',e=>{e.stopPropagation();tgm(mark.dataset.id,mark.dataset.date,mark.dataset.action)})});
  D.getElementById('btnDayPrev').addEventListener('click',()=>{cdd=ad(cdd,-1);rdv()});
  D.getElementById('btnDayNext').addEventListener('click',()=>{cdd=ad(cdd,1);rdv()});
}
const dcs=document.createElement('style');dcs.textContent='.day-card::before{background:var(--c)}';document.head.appendChild(dcs);

function tgm(cid,d,action){
  const c=courses.find(x=>x.id===cid);if(!c)return;const now=new Date();
  const ep=c.endTime.split(':');const ed=new Date(d+'T00:00:00');ed.setHours(+ep[0],+ep[1],0,0);
  if(action==='togglePaid'){if(!c.marks)c.marks={};if(!c.marks[d])c.marks[d]={completed:false,paid:false};c.marks[d].paid=!c.marks[d].paid;S(KC,courses);rdv();toast('课费标记已更新');return}
  if(now<=ed){toast('课程尚未结束');return}
  if(!c.marks)c.marks={};if(!c.marks[d])c.marks[d]={completed:false,paid:false};
  c.marks[d].completed=!c.marks[d].completed;
  if(c.marks[d].completed&&isAutoPaid(c,d))c.marks[d].paid=true;
  S(KC,courses);rdv();toast('标记已更新');
}

// NAV
function unw(){D.getElementById('weekInfo').textContent=md(cws)+' - '+md(ad(cws,6))}
function gw(d){cws=ad(cws,d*7);unw();if(cv==='week')rwv();else{cdd=ad(cdd,d*7);rdv()}}
function gt(){cws=monday(today());cdd=today();unw();if(cv==='week')rwv();else rdv()}
function swv(v){cv=v;D.getElementById('weekView').style.display=v==='week'?'block':'none';D.getElementById('dayView').style.display=v==='day'?'block':'none';D.querySelectorAll('#viewToggle button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='day')cdd=cws;if(v==='week')rwv();else rdv()}

// STUDENT LIST/DETAIL
function rsl(q){q=(q||'').toLowerCase();const f=students.filter(s=>!q||s.name.toLowerCase().includes(q)||(s.level||'').toLowerCase().includes(q));const ct=D.getElementById('studentList'),dt=D.getElementById('studentDetail');dt.style.display='none';ct.style.display='block';if(!f.length){ct.innerHTML='<div class="empty-state">暂无学生</div>';return}
  ct.innerHTML=f.map(s=>{const onm=on(s.organizationId);const cc=courses.filter(c=>c.studentId===s.id).length;const bal=s.paymentMode==='prepaid'?prepaidBalance(s.id):null;const tag=s.paymentMode==='prepaid'?'<span class="li-tag prepaid">预付费'+(bal?' ¥'+bal.remaining:'')+'</span>':'<span class="li-tag postpaid">后付费</span>';return`<div class="list-item" data-sid="${s.id}"><div class="li-avatar" style="background:${DC[Math.abs(s.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%DC.length]}">${s.name[0]}</div><div class="li-info"><div class="li-name">${s.name} ${tag}</div><div class="li-sub">${[s.age?s.age+'岁':'',s.level||'',onm||''].filter(Boolean).join(' · ')} · ${cc}门课${s.defaultTuition?' · 默认¥'+s.defaultTuition:''}</div></div><div class="li-arrow">›</div></div>`}).join('');
  ct.querySelectorAll('.list-item').forEach(item=>{item.addEventListener('click',()=>rsd(item.dataset.sid))});
}
function rsd(sid){const s=getStudent(sid);if(!s)return;const ct=D.getElementById('studentList'),dt=D.getElementById('studentDetail'),c=D.getElementById('studentDetailContent');ct.style.display='none';dt.style.display='block';exid=sid;const onm=on(s.organizationId);const sc=courses.filter(c=>c.studentId===sid).sort((a,b)=>a.date.localeCompare(b.date)||tm(a.startTime)-tm(b.startTime));const bal=s.paymentMode==='prepaid'?prepaidBalance(sid):null;
  let h=`<div style="padding:12px 16px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><div style="width:48px;height:48px;border-radius:50%;background:${DC[Math.abs(s.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%DC.length]};color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700">${s.name[0]}</div><div><div style="font-size:18px;font-weight:700">${s.name}</div><div style="font-size:12px;color:var(--text2)">${[s.age?s.age+'岁':'',s.level?'基础:'+s.level:'',onm||''].filter(Boolean).join(' · ')}${s.defaultTuition?' · 课费¥'+s.defaultTuition:''}</div></div></div>`;
  if(bal){const pct=bal.total?Math.round(bal.remaining/bal.total*100):0;const cls=pct>30?'':(pct>10?'low':'empty');h+=`<div style="background:var(--surface);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>预付费余额</span><span style="font-weight:700;color:${cls==='empty'?'var(--danger)':(cls==='low'?'var(--warning)':'var(--accent)')}">¥${bal.remaining} / ¥${bal.total}</span></div><div class="prepaid-bar"><div class="pb-fill ${cls}" style="width:${pct}%"></div></div><div style="font-size:10px;color:var(--text2);margin-top:2px">已用 ¥${bal.used} · 充值日期 ${md(s.prepaidDate)}</div></div>`}
  h+=`<div style="font-size:13px;font-weight:700;margin-bottom:8px">📚 课程 (${sc.length}门)</div>`;
  if(!sc.length)h+='<div style="color:var(--text3);padding:20px 0">暂无课程</div>';
  else sc.forEach(co=>{const dates=expanded(co);h+=`<div style="padding:8px 12px;margin:4px 0;background:var(--bg);border-radius:8px;border-left:3px solid ${co.color};font-size:12px"><div style="font-weight:600">${co.name}</div><div style="color:var(--text2)">${md(co.date)} ${co.startTime}-${co.endTime}${co.repeat==='weekly'?' · 每周至'+md(co.repeatUntil):''}</div><div style="color:var(--text2)">${co.location?'📍'+co.location+' ':''}💰¥${co.tuition}</div></div>`});
  h+='</div>';c.innerHTML=h;
}

// STUDENT MODAL
function osm(sid){seid=sid||null;D.getElementById('studentModalTitle').textContent=sid?'编辑学生':'添加学生';D.getElementById('btnDeleteStudent').style.display=sid?'block':'none';D.getElementById('studentId').value=sid||'';if(sid){const s=getStudent(sid);if(!s)return;D.getElementById('sNameI').value=s.name;D.getElementById('sAge').value=s.age||'';D.getElementById('sLevel').value=s.level||'';D.getElementById('sOrgId').value=s.organizationId||'';D.getElementById('sDefTuition').value=s.defaultTuition||'';D.getElementById('sPaymentMode').value=s.paymentMode||'postpaid';D.getElementById('sPrepaidAmt').value=s.prepaidAmount||'';D.getElementById('sPrepaidDate').value=s.prepaidDate||''}else{D.getElementById('sNameI').value='';D.getElementById('sAge').value='';D.getElementById('sLevel').value='';D.getElementById('sDefTuition').value='';D.getElementById('sPaymentMode').value='postpaid';D.getElementById('sPrepaidAmt').value='';D.getElementById('sPrepaidDate').value=''}D.getElementById('sPrepaidGroup').style.display=D.getElementById('sPaymentMode').value==='prepaid'?'block':'none';poo('sOrgId',true);D.getElementById('studentModal').style.display='flex'}
function sst(){
  const n=D.getElementById('sNameI').value.trim();if(!n){toast('请输入姓名');return}
  if(seid){if(students.find(x=>x.name===n&&x.id!==seid)){toast('姓名已存在');return}}else{if(students.find(x=>x.name===n)){toast('姓名已存在');return}}
  const st={id:seid||G(),name:n,age:parseInt(D.getElementById('sAge').value)||0,level:D.getElementById('sLevel').value.trim(),organizationId:D.getElementById('sOrgId').value,defaultTuition:parseFloat(D.getElementById('sDefTuition').value)||0,paymentMode:D.getElementById('sPaymentMode').value,prepaidAmount:parseFloat(D.getElementById('sPrepaidAmt').value)||0,prepaidDate:D.getElementById('sPrepaidDate').value};
  if(seid)students=students.map(x=>x.id===seid?st:x);else students.push(st);S(KS,students);D.getElementById('studentModal').style.display='none';rsl();toast(seid?'已更新':'已添加')}
function dst(){if(!seid)return;if(!confirm('确定删除？关联课程的学生信息将丢失。'))return;students=students.filter(x=>x.id!==seid);S(KS,students);D.getElementById('studentModal').style.display='none';rsl();toast('已删除')}

// ORG LIST/DETAIL/MODAL
function rol(q){q=(q||'').toLowerCase();const f=orgs.filter(o=>!q||o.name.toLowerCase().includes(q)||(o.campus||'').toLowerCase().includes(q)||(o.location||'').toLowerCase().includes(q));const ct=D.getElementById('orgList'),dt=D.getElementById('orgDetail');dt.style.display='none';ct.style.display='block';if(!f.length){ct.innerHTML='<div class="empty-state">暂无机构</div>';return}
  ct.innerHTML=f.map(o=>{const cc=courses.filter(c=>c.organizationId===o.id).length,sc=students.filter(s=>s.organizationId===o.id).length;return`<div class="list-item" data-oid="${o.id}"><div class="li-avatar" style="background:${DC[Math.abs(o.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%DC.length]}">${o.name[0]}</div><div class="li-info"><div class="li-name">${o.name}${o.campus?' · '+o.campus:''}</div><div class="li-sub">${o.location||''} · ${cc}门课 · ${sc}名学生</div></div><div class="li-arrow">›</div></div>`}).join('');
  ct.querySelectorAll('.list-item').forEach(item=>{item.addEventListener('click',()=>rod(item.dataset.oid))});
}
function rod(oid){const o=orgs.find(x=>x.id===oid);if(!o)return;D.getElementById('orgList').style.display='none';D.getElementById('orgDetail').style.display='block';const c=D.getElementById('orgDetailContent');c.dataset.oid=oid;const os=students.filter(s=>s.organizationId===oid);c.innerHTML=`<div style="padding:12px 16px"><div style="font-size:18px;font-weight:700">${o.name}${o.campus?' · '+o.campus:''}</div><div style="font-size:12px;color:var(--text2)">${o.location||''} · ${os.length}名学生</div></div>`}

// SALARY
function rss(){
  const c=D.getElementById('salaryContent');const now=ds();
  // Group all expanded courses
  const all=[];courses.forEach(co=>{const dates=expanded(co);dates.forEach(d=>{const mk=co.marks&&co.marks[d]?co.marks[d]:{completed:false,paid:false};all.push({...co,date:d,completed:mk.completed,paid:mk.paid})})});
  const paidList=all.filter(x=>x.paid),unpaidList=all.filter(x=>!x.paid);

  // Monthly
  const byMonth={};all.forEach(x=>{const m=x.date.slice(0,7);if(!byMonth[m])byMonth[m]=0;byMonth[m]+=x.tuition||0});
  let h='<div class="salary-section"><h3>📊 按月汇总</h3>';
  Object.keys(byMonth).sort().reverse().forEach(m=>{h+=`<div class="salary-row"><span class="sr-label">${m}</span><span class="sr-val green">¥${byMonth[m]}</span></div>`});

  // By org
  const byOrg={},byOrgPaid={};all.forEach(x=>{const oid=x.organizationId||'_none';if(!byOrg[oid]){byOrg[oid]=0;byOrgPaid[oid]=0}byOrg[oid]+=x.tuition||0;if(x.paid)byOrgPaid[oid]+=x.tuition||0});
  h+='</div><div class="salary-section"><h3>🏢 按机构汇总</h3>';
  Object.entries(byOrg).sort((a,b)=>b[1]-a[1]).forEach(([oid,total])=>{const p=byOrgPaid[oid]||0,unp=total-p;const nm=oid==='_none'?'无机构':on(oid);h+=`<div class="salary-row"><div><span class="sr-label">${nm}</span><div class="salary-sub">已发 ¥${p} · 待结 ¥${unp}</div></div><span class="sr-val green">¥${total}</span></div>`});

  // By student
  const byStu={},byStuPaid={};all.forEach(x=>{const sid=x.studentId||'_none';if(!byStu[sid]){byStu[sid]=0;byStuPaid[sid]=0}byStu[sid]+=x.tuition||0;if(x.paid)byStuPaid[sid]+=x.tuition||0});
  h+='</div><div class="salary-section"><h3>👨‍🎓 按学生汇总</h3>';
  Object.entries(byStu).sort((a,b)=>b[1]-a[1]).forEach(([sid,total])=>{const p=byStuPaid[sid]||0,unp=total-p;const nm=sid==='_none'?'无学生':sn(sid);h+=`<div class="salary-row"><div><span class="sr-label">${nm}</span><div class="salary-sub">已收 ¥${p} · 未收 ¥${unp}</div></div><span class="sr-val ${unp>0?'orange':'green'}">¥${total}</span></div>`});

  h+='</div>';c.innerHTML=h;
}

function uex(){const s=getStudent(exid);if(!s)return;const from=D.getElementById('expStart').value,to=D.getElementById('expEnd').value;const f=courses.filter(c=>c.studentId===exid).sort((a,b)=>a.date.localeCompare(b.date));let t='学生: '+s.name+'\n范围: '+(from||'?')+' ~ '+(to||'?')+'\n'+'─'.repeat(30)+'\n';let total=0,cnt=0;f.forEach(c=>{const dt=expanded(c);dt.forEach(d=>{if((!from||d>=from)&&(!to||d<=to)){t+='\n'+md(d)+' '+DN[dow(d)-1]+' '+c.startTime+'-'+c.endTime+' '+c.name+'\n  '+c.location+' 💰¥'+c.tuition+' '+on(c.organizationId)+'\n';total+=c.tuition||0;cnt++}})});t+='\n'+'─'.repeat(30)+'\n合计: ¥'+total+'\n共 '+cnt+' 节';D.getElementById('exportPreview').textContent=t}

// ICS
function eics(s){return(s||'').replace(/[\\;,]/g,'\\$&').replace(/\n/g,'\\n')}
function fids(d,t){const[p,m]=t.split(':');const dt=new Date(d+'T00:00:00');dt.setHours(+p,+m,0,0);return dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
function gics(){let ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TS//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+eics(config.scheduleName)];courses.forEach(c=>{const dt=expanded(c),snm=sn(c.studentId),onm=on(c.organizationId);dt.forEach(d=>{const sum='📚 '+c.name+(snm?' ('+snm+')':''),loc=[c.location,onm].filter(Boolean).join(' / '),desc=['学生: '+snm,'地点: '+(c.location||''),'机构: '+onm,'课费: ¥'+(c.tuition||0),c.note].filter(Boolean).join('\\n');ics.push('BEGIN:VEVENT','DTSTART:'+fids(d,c.startTime),'DTEND:'+fids(d,c.endTime),'SUMMARY:'+eics(sum));if(loc)ics.push('LOCATION:'+eics(loc));ics.push('DESCRIPTION:'+eics(desc),'BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY','DESCRIPTION:课程提醒: '+eics(c.name),'END:VALARM','END:VEVENT')})});ics.push('END:VCALENDAR');return ics.join('\r\n')}
function eicsfn(){if(!courses.length){toast('暂无课程');return}const ics=gics(),b=new Blob([ics],{type:'text/calendar;charset=utf-8'}),fn=config.scheduleName+'.ics';if(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([b],fn,{type:'text/calendar'})]})){navigator.share({files:[new File([b],fn,{type:'text/calendar'})]}).catch(()=>dl())}else dl();function dl(){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),1e3)}toast('📥 日历文件已生成')}

(function(){const m={name:'课程表',short_name:'课程表',start_url:location.href,display:'standalone',orientation:'portrait',background_color:'#f5f5f7',theme_color:'#1d1d1f',icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#4CAF50"/><text x="96" y="124" text-anchor="middle" font-size="110" font-family="sans-serif">📅</text></svg>'),sizes:'192x192',type:'image/svg+xml'}]};document.head.appendChild((()=>{const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));return l})())})();
if('serviceWorker' in navigator){const sw=`const C='schedule-v6';self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))).then(()=>self.clients.claim()))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{if(resp.ok){const o=resp.clone();caches.open(C).then(c=>c.put(e.request,o))}return resp}).catch(()=>caches.match(e.request))))});`;navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'})),{scope:'/'}).catch(()=>{})}
