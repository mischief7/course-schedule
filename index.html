<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="课程表">
<meta name="theme-color" content="#1d1d1f">
<meta name="description" content="教师课程表">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%234CAF50'/><text x='90' y='115' text-anchor='middle' font-size='100' font-family='sans-serif'>📅</text></svg>">
<title>教师排课表</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
:root{
  --bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--text2:#6e6e73;--text3:#aeaeb2;
  --border:#e5e5ea;--accent:#4CAF50;--accent-hover:#43a047;--danger:#ff3b30;
  --warning:#ff9500;--blue:#007aff;--shadow:0 2px 12px rgba(0,0,0,.08);
  --radius:14px;--radius-sm:10px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --tab-h:calc(56px + var(--safe-bottom));
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  background:var(--bg);
  color:var(--text);height:100%;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
.bg-schedule-area{background-size:cover;background-position:center;background-repeat:no-repeat}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--text)}
select{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;width:100%}
input[type=time],input[type=date]{min-height:44px}
#app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 14px) 16px 8px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.header h1{font-size:18px;font-weight:700}
.btn-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.btn-icon:active{background:var(--border)}
.btn-sm{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:600;background:var(--accent);color:#fff}
.btn-sm-outline{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:600;border:1.5px solid var(--border);color:var(--text)}
.week-nav{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;background:var(--surface);flex-shrink:0;border-bottom:1px solid var(--border)}
.week-nav-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--bg)}
.week-nav-btn:active{background:var(--border)}
.week-nav-info{font-size:13px;font-weight:600;text-align:center;min-width:160px}
.btn-today{font-size:11px;padding:4px 10px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}
.view-toggle{display:flex;gap:3px;background:var(--bg);border-radius:8px;padding:2px;flex-shrink:0}
.view-toggle button{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text2);transition:all .2s}
.view-toggle button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--tab-h)+10px)}
.page{display:none}.page.active{display:block}
.sc-block{padding:6px 4px 8px;background:var(--surface);border-bottom:1px solid var(--border)}
.sc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 8px}
.sc-card{background:var(--bg);border-radius:var(--radius-sm);padding:8px 4px;text-align:center;cursor:pointer}
.sc-card:active{background:var(--border)}
.sc-card .sc-icon{font-size:18px;margin-bottom:2px}
.sc-card .sc-val{font-size:18px;font-weight:700;line-height:1.2}
.sc-card .sc-lbl{font-size:10px;color:var(--text2);margin-top:2px}
.sc-card.warn .sc-val{color:var(--warning)}
.sc-card.green .sc-val{color:#2e7d32}
.sc-card.red .sc-val{color:#c62828}
.sc-card.blue .sc-val{color:#1565c0}

#weekView{padding:4px 4px 20px}
.week-grid{position:relative;display:grid;grid-template-columns:44px repeat(7,1fr)}
.day-label{background:var(--surface);text-align:center;padding:8px 2px;font-size:13px;font-weight:700;border-bottom:2px solid var(--border);line-height:1.4;border-right:1px solid #bbb}
.day-label span{display:block;font-size:11px;color:var(--text2);font-weight:500;margin-top:1px}
.day-label.today{border-bottom-color:var(--accent);color:var(--accent)}.day-label.today span{color:var(--accent)}
.time-label{font-size:11px;color:var(--text2);text-align:right;padding:0 4px 0 0;height:22px;line-height:22px;font-weight:600;border-bottom:1px solid #e0e0e0}
.time-label.hour{font-weight:700;color:var(--text)}
.day-col{position:relative;min-height:22px}
/* Horizontal grid lines — drawn PER COLUMN UNDER course blocks (z-index:1 < course z-index:2).
   inset:0 against o's padding-box which excludes the 2px right border → vertical line stays visible */
.grid-hlines{position:absolute;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(to bottom,transparent 0,transparent 21px,#d0d0d0 21px,#d0d0d0 22px)}
.course-block{position:absolute;left:0;right:2px;border-radius:4px;padding:2px 5px;font-size:11px;line-height:1.25;overflow:hidden;cursor:pointer;color:#fff;font-weight:600;z-index:2;display:flex;flex-direction:column;justify-content:center;text-shadow:0 1px 2px rgba(0,0,0,.3);border:2px solid rgba(0,0,0,.25)}
.course-block.warn{border-color:var(--warning);box-shadow:0 0 0 2px var(--warning);animation:warnPulse 1.5s infinite}
@keyframes warnPulse{0%,100%{box-shadow:0 0 0 2px var(--warning)}50%{box-shadow:0 0 0 4px var(--warning)}}
.course-block:active{transform:scale(.97)}
.course-block .cb-row{flex-shrink:0}
.course-block .cb-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;line-height:1.2}
.course-block .cb-meta{font-size:10px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.course-block .cb-status{font-size:9px;opacity:.95;line-height:1;margin-top:auto;display:flex;gap:3px}
.course-block .cb-expand{position:absolute;top:1px;right:2px;font-size:9px;opacity:.7;cursor:pointer;padding:1px 4px;background:rgba(0,0,0,.2);border-radius:3px;line-height:1;transition:all .15s;color:#fff;z-index:4;pointer-events:auto}
.course-block .cb-expand:active{opacity:1;transform:scale(1.15)}
.course-block.expanded{height:auto!important;min-height:60px;max-height:none;z-index:10;box-shadow:0 4px 20px rgba(0,0,0,.35);white-space:normal}
.course-block.expanded .cb-row{display:block!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important}
.course-block.expanded .cb-name{font-size:13px;font-weight:700;margin-bottom:3px}
.course-block.expanded .cb-meta{font-size:10px;line-height:1.4;margin-top:2px}

#dayView{padding:8px 12px 20px}
.day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.day-header h2{font-size:17px;font-weight:700}
.day-card{background:var(--surface);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.day-card.warn{box-shadow:0 0 0 2px var(--warning),0 0 12px rgba(255,149,0,.25)}
.day-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px}
.day-card .dc-time{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--accent);display:flex;align-items:center;gap:8px}
.day-card .dc-time-icon{font-size:12px;background:var(--bg);color:var(--text);padding:3px 8px;border-radius:8px;font-weight:600}
.day-card .dc-name{font-size:19px;font-weight:700;margin-bottom:10px;line-height:1.3}
.day-card .dc-info{font-size:14px;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.day-card .dc-info-icon{font-size:14px;flex-shrink:0;opacity:.7;width:18px;text-align:center}
.day-card .dc-tuition{font-size:15px;font-weight:700;color:#e65100;margin:8px 0 12px;padding:8px 12px;background:#fff8e1;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.day-card .dc-tuition-label{font-size:12px;font-weight:500;color:#e65100;opacity:.7}
.day-card .dc-status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:12px;border-top:1px solid var(--border);margin-top:4px}
.day-card .dc-chip{font-size:12px;padding:8px 6px;border-radius:12px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;text-align:center;line-height:1.2;min-height:36px}
.day-card .dc-chip.green{background:#e8f5e9;color:#2e7d32}
.day-card .dc-chip.red{background:#fce4ec;color:#c62828}
.day-card .dc-chip.orange{background:#fff3e0;color:#e65100}
.day-card .dc-chip.blue{background:#e3f2fd;color:#1565c0}
.day-card .dc-chip.gray{background:var(--bg);color:var(--text2)}
.day-card .dc-mark{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg);display:flex;align-items:center;gap:3px;cursor:pointer}
.day-card .dc-mark.done{background:#e8f5e9;color:#2e7d32}
.day-card .dc-mark.warn{background:#fff3e0;color:#e65100;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.day-empty{text-align:center;padding:80px 20px;color:var(--text3)}
.day-empty .empty-icon{font-size:48px;margin-bottom:12px}

.schedule-footer{display:flex;gap:6px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.tab-bar{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:var(--safe-bottom)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 0 3px;font-size:9px;color:var(--text3);transition:color .15s}
.tab-item .tab-icon{font-size:18px;margin-bottom:1px}
.tab-item.active{color:var(--accent)}

.list-item{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin:6px 12px;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:pointer;display:flex;align-items:center;gap:12px}
.list-item .li-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.list-item .li-info{flex:1;min-width:0}
.list-item .li-name{font-size:15px;font-weight:600}
.list-item .li-sub{font-size:12px;color:var(--text2);margin-top:2px}
.list-item .li-arrow{color:var(--text3);font-size:14px}
.list-item .li-tag{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600;display:inline-block;margin-left:4px}
.list-item .li-tag.prepaid{background:#e3f2fd;color:#1565c0}
.list-item .li-tag.postpaid{background:#fff3e0;color:#e65100}
.list-item .li-tag.individual{background:#e8f5e9;color:#2e7d32}
.list-item .li-tag.institutional{background:#e3f2fd;color:#1565c0}
.section-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.section-hd h3{font-size:14px;font-weight:700}
.sub-hd{font-size:13px;font-weight:700;color:var(--text);padding:8px 0 4px}
.empty-state{text-align:center;padding:50px 20px;color:var(--text3);font-size:13px;line-height:1.8}

.salary-section{margin:12px 16px}
.salary-section h3{font-size:15px;font-weight:700;margin-bottom:8px}
.salary-row{display:flex;justify-content:space-between;padding:10px 14px;background:var(--surface);border-radius:var(--radius-sm);margin:4px 0;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.04);align-items:center}
.salary-row .sr-label{font-weight:600}.salary-row .sr-val{font-weight:700}
.salary-row .sr-val.green{color:#2e7d32}.salary-row .sr-val.red{color:#c62828}.salary-row .sr-val.orange{color:#e65100}
.salary-sub{font-size:11px;color:var(--text2)}
.chart-box{background:var(--surface);border-radius:var(--radius-sm);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.chart-box svg{width:100%;height:auto;display:block}
.chart-toggle{margin:8px 0;display:flex;gap:6px;font-size:12px;align-items:center}
.chart-toggle select{padding:4px 8px;font-size:12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);width:auto}
.prepaid-bar{margin:8px 0;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.prepaid-bar .pb-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.prepaid-bar .pb-fill.low{background:var(--warning)}.prepaid-bar .pb-fill.empty{background:var(--danger)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);width:calc(100% - 32px);max-width:400px;max-height:80vh;border-radius:16px;display:flex;flex-direction:column;animation:slideUp .25s;overflow:hidden}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:17px;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px}
.modal-footer{display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--border)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg)}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);outline:none}
.form-row{display:flex;gap:10px}.form-row .form-group{flex:1}
.req{color:var(--danger)}.hint{font-size:10px;color:var(--text2);margin-top:3px}
.repeat-row{padding:10px 14px;background:var(--bg);border-radius:var(--radius-sm);margin:8px 0}
.color-picker{display:flex;gap:6px;flex-wrap:wrap}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color-dot.selected{border-color:var(--text);box-shadow:0 0 0 3px rgba(0,0,0,.1)}
.btn-primary{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;background:var(--accent);color:#fff;text-align:center}
.btn-secondary{padding:12px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;background:var(--bg);color:var(--text);text-align:center;flex-shrink:0}
.btn-danger{color:var(--danger);font-weight:600;font-size:14px}
.btn-save{padding:10px 28px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;background:var(--accent);color:#fff}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1d1d1d;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;white-space:nowrap;animation:toastIn .3s,toastOut .3s 2s forwards;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
.install-banner{position:fixed;bottom:100px;left:16px;right:16px;z-index:90;background:var(--surface);border-radius:var(--radius);padding:14px 18px;box-shadow:0 4px 24px rgba(0,0,0,.15);display:flex;align-items:center;gap:12px;animation:slideUp .3s}
.install-banner .ib-text{flex:1;font-size:13px;font-weight:600}
.install-banner .ib-btn{padding:8px 16px;border-radius:16px;background:var(--accent);color:#fff;font-size:13px;font-weight:600}
.search-bar{padding:8px 12px}
.search-bar input{width:100%;padding:10px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-size:14px}
#importFile{display:none}
</style>
</head>
<body>
<div id="app">
  <header class="header" id="mainHeader"><h1 id="headerTitle">📅 教师排课表</h1><div class="header-actions" id="headerActions"><button class="btn-icon" id="btnSettings" title="设置">⚙</button></div></header>
  <nav class="week-nav" id="weekNav"><button class="week-nav-btn" id="btnPrev">◀</button><div class="week-nav-info" id="weekInfo">加载中…</div><button class="week-nav-btn" id="btnNext">▶</button><div class="view-toggle" id="viewToggle"><button data-view="week" class="active">周</button><button data-view="day">日</button></div><button class="btn-today" id="btnToday">今天</button></nav>
  <main class="main-content" id="mainContent">
    <div id="pageSchedule" class="page active">
      <div class="sc-block"><div class="sc-grid" id="scGrid"></div></div>
      <div id="weekView"></div><div id="dayView" style="display:none"></div>
    </div>
    <div id="pageStudents" class="page"><div class="section-hd"><h3>学生列表</h3><button class="btn-sm" id="btnAddStudent">+ 添加</button></div><div class="search-bar"><input type="text" id="studentSearch" placeholder="搜索学生..."></div><div id="studentList"></div><div id="studentDetail" style="display:none"><div class="section-hd"><button class="btn-sm-outline" id="btnStudentBack">← 返回</button><div style="display:flex;gap:6px"><button class="btn-sm-outline" id="btnStudentExport">📤 导出</button><button class="btn-sm" id="btnStudentEdit">编辑</button></div></div><div id="studentDetailContent"></div></div></div>
    <div id="pageOrgs" class="page"><div class="section-hd"><h3>机构列表</h3><button class="btn-sm" id="btnAddOrg">+ 添加</button></div><div class="search-bar"><input type="text" id="orgSearch" placeholder="搜索机构..."></div><div id="orgList"></div><div id="orgDetail" style="display:none"><div class="section-hd"><button class="btn-sm-outline" id="btnOrgBack">← 返回</button><button class="btn-sm" id="btnOrgEdit">编辑</button></div><div id="orgDetailContent"></div></div></div>
    <div id="pageSalary" class="page"><div class="section-hd"><h3>💰 工资汇总</h3></div><div id="salaryContent"></div></div>
    <div id="pageSettings" class="page"><div style="padding:12px 16px"><div class="form-group"><label>课程表名称</label><input type="text" id="sName"></div><div class="form-group"><label>背景图（可选）</label><input type="file" id="bgFile" accept="image/*" style="padding:8px 0;border:none;background:none"><span class="hint" id="bgStatus"></span><button class="btn-sm-outline" id="btnRemoveBg" style="margin-top:4px;display:none">移除</button></div><button class="btn-primary" id="btnSaveSettingsCfg" style="width:100%;margin-bottom:20px">保存设置</button><h3 style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">数据管理</h3><div style="background:var(--bg);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:10px"><button class="btn-primary" id="btnExportDataS" style="width:100%;background:var(--bg);color:var(--text);margin-bottom:1px;border-radius:0">📤 导出全部数据 (JSON)</button><button class="btn-primary" id="btnImportDataS" style="width:100%;background:var(--bg);color:var(--text);margin-bottom:1px;border-radius:0">📥 导入数据恢复 (JSON)</button><button class="btn-primary" id="btnClearAllS" style="width:100%;background:var(--bg);color:var(--danger);border-radius:0">🗑 清空所有数据</button></div><input type="file" id="importFile" accept=".json"></div></div>
  </main>
  <div class="schedule-footer" id="scheduleFooter"><button class="btn-primary" id="btnAddCourse">+ 添加课程</button><button class="btn-secondary" id="btnBatchAdd" style="font-size:13px">+ 批量</button><button class="btn-secondary" id="btnExport">📥 导出</button></div>
  <nav class="tab-bar" id="tabBar">
    <button class="tab-item active" data-tab="schedule"><span class="tab-icon">📅</span>课程表</button>
    <button class="tab-item" data-tab="students"><span class="tab-icon">👨‍🎓</span>学生</button>
    <button class="tab-item" data-tab="orgs"><span class="tab-icon">🏢</span>机构</button>
    <button class="tab-item" data-tab="salary"><span class="tab-icon">💰</span>工资</button>
    <button class="tab-item" data-tab="settings"><span class="tab-icon">⚙</span>设置</button>
  </nav>
</div>

<!-- COURSE MODAL -->

<script>
const A='_v6',KC='schedule_courses'+A,KS='schedule_students'+A,KO='schedule_orgs'+A,KF='schedule_config'+A,KN='schedule_coursenames'+A;
const DC=['#4CAF50','#2196F3','#FF9800','#E91E63','#9C27B0','#00BCD4','#FF5722','#607D8B','#795548','#3F51B5','#009688','#CDDC39','#FFC107','#673AB7','#8BC34A'];
function studentColor(sid){const idx=students.findIndex(function(s){return s.id===sid});return DC[idx%DC.length]}
const DN=['周一','周二','周三','周四','周五','周六','周日'],D=document;
function L(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v===null||v===undefined?d:v}catch(e){return d}}
function S(k,v){localStorage.setItem(k,JSON.stringify(v))}
function G(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

// V4→V5 migration: just ensure marks has expected shape; older data auto-fills missing fields as needed
let courses=L(KC,[]),students=L(KS,[]),orgs=L(KO,[]),config=L(KF,{scheduleName:'我的课程表',bgImage:''}),courseNames=L(KN,[]);
// Migration will run in init() after functions defined

function td(s){if(!s||typeof s!=='string')return new Date();const p=s.split('-');if(p.length!==3||isNaN(+p[0]))return new Date();return new Date(+p[0],+p[1]-1,+p[2])}
function ds(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ad(s,n){const d=td(s||ds());d.setDate(d.getDate()+(+n||0));return ds(d)}
function dow(s){return td(s).getDay()||7}
function monday(s){const d=td(s||ds());d.setDate(d.getDate()-(d.getDay()||7)+1);return ds(d)}
function today(){return ds(new Date())}
function md(s){const d=td(s);return (d.getMonth()+1)+'月'+d.getDate()+'日'}
function ms(s){const d=td(s);return (d.getMonth()+1)+'/'+d.getDate()}
function tm(t){const[p,m]=t.split(':').map(Number);return p*60+m}
function addMin(t,n){const total=tm(t)+(+n||0);const h=Math.floor(total/60),m=total%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function monthOf(s){return s.slice(0,7)}

function getForDate(d){return courses.filter(c=>{if(c.date===d)return true;if(c.repeat==='weekly'&&c.repeatUntil&&d>=c.date&&d<=c.repeatUntil&&dow(c.date)===dow(d))return true;if(c.repeat==='daily'&&c.repeatUntil&&d>=c.date&&d<=c.repeatUntil)return true;return false}).sort((a,b)=>tm(a.startTime)-tm(b.startTime))}
function expanded(c){const d=[];if(c.repeat==='weekly'&&c.repeatUntil){let t=c.date;while(t<=c.repeatUntil){d.push(t);t=ad(t,7)}}else if(c.repeat==='daily'&&c.repeatUntil){let t=c.date;while(t<=c.repeatUntil){d.push(t);t=ad(t,1)}}else d.push(c.date);return d}
function sn(id){const s=students.find(x=>x.id===id);return s?s.name:''}
function on(id){const o=orgs.find(x=>x.id===id);return o?o.name+(o.campus?' - '+o.campus:''):''}
function getStudent(id){return students.find(x=>x.id===id)||null}
function getOrg(id){return orgs.find(x=>x.id===id)||null}

function prepaidBalance(student){
  const entries=(student?student.prepaidEntries:[])||[];
  if(!entries.length)return null;
  const sorted=entries.slice().sort(function(a,b){return(a.date||'').localeCompare(b.date||'')});
  const total=sorted.reduce(function(s,e){return s+(e.amount||0)},0);
  // Get completed courses for this student sorted by date, deduct from earliest entry first
  const completed=[];courses.forEach(function(c){if(c.studentId===student.id){const dt=expanded(c);dt.forEach(function(d){const mk=c.marks&&c.marks[d];if(mk&&mk.completed)completed.push({date:d,tuition:c.tuition||0})})}});completed.sort(function(a,b){return a.date.localeCompare(b.date)});
  const used=completed.reduce(function(s,x){return s+x.tuition},0);
  // Apply per-entry remaining
  const balances=sorted.map(function(e){return{amount:e.amount,date:e.date,remaining:e.amount||0}});
  completed.forEach(function(c){
    let need=c.tuition;
    for(const bal of balances){
      if(bal.remaining<=0)continue;
      const deduct=Math.min(bal.remaining,need);
      bal.remaining-=deduct;need-=deduct;if(need<=0)break;
    }
  });
  const remaining=balances.reduce(function(s,e){return s+e.remaining},0);
  return{entries:balances,total:total,remaining:remaining};
} 
function isAutoPaid(c,d){const s=getStudent(c.studentId);if(!s||s.paymentMode!=='prepaid')return false;const b=prepaidBalance(s);return b&&b.remaining>=(c.tuition||0);}

let cws=monday(today()),cdd=today(),cv='week',tab='schedule';
let eid=null,seid=null,oeid=null,exid=null,dip=null;

function swt(t){
  tab=t;D.querySelectorAll('.tab-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  ['Schedule','Students','Orgs','Salary','Settings'].forEach(p=>D.getElementById('page'+p).classList.toggle('active',p.toLowerCase()===t));
  D.getElementById('weekNav').style.display=t==='schedule'?'flex':'none';
  D.getElementById('scheduleFooter').style.display=t==='schedule'?'flex':'none';
  D.getElementById('viewToggle').style.display=t==='schedule'?'':'none';
  D.getElementById('headerTitle').textContent={schedule:'📅 教师排课表',students:'👨‍🎓 学生管理',orgs:'🏢 机构管理',salary:'💰 工资汇总',settings:'⚙ 设置'}[t];
  if(t==='schedule'){rsc();if(cv==='week')rwv();else rdv()}
  else if(t==='students')rsl();else if(t==='orgs')rol();else if(t==='salary')rss();else rst();
}

// C4 DASHBOARD
function rsc(){
  const g=D.getElementById('scGrid');const td_=today();const yr=td_.slice(0,4),mn=td_.slice(5,7);
  const todayCount=getForDate(td_).length;
  let monthPaid=0,pending=0,toMark=0;
  const now=new Date();
  courses.forEach(c=>{
    const dates=expanded(c);dates.forEach(d=>{
      const m=c.marks&&c.marks[d]?c.marks[d]:{completed:false,paid:false,a:null};
      if(d.startsWith(yr+'-'+mn)){if(m.paid)monthPaid+=c.tuition||0}if(d<=td_&&m.completed&&!m.paid&&!m.skipped)pending+=c.tuition||0
      const ep=c.endTime.split(':');const ed=new Date(d+'T00:00:00');ed.setHours(+ep[0],+ep[1],0,0);
      if(now>ed&&!m.completed&&!m.skipped)toMark++;
    });
  });
  g.innerHTML=`<div class="sc-card" onclick="cdd=today();swv('day');cddScroll()"><div class="sc-icon">📚</div><div class="sc-val">${todayCount}</div><div class="sc-lbl">今日课程</div></div>
    <div class="sc-card green"><div class="sc-icon">💰</div><div class="sc-val">¥${monthPaid}</div><div class="sc-lbl">本月已收</div></div>
    <div class="sc-card red"><div class="sc-icon">⏰</div><div class="sc-val">¥${pending}</div><div class="sc-lbl">待结课费</div></div>
    <div class="sc-card warn"><div class="sc-icon">⚠️</div><div class="sc-val">${toMark}</div><div class="sc-lbl">待标记</div></div>`;
}
window.cddScroll=function(){document.querySelector('.main-content').scrollTo({top:0,behavior:'smooth'})};

function rwv(){const c=D.getElementById('weekView'),tod=today();const dates=[];for(let i=0;i<7;i++)dates.push(ad(cws,i));
  let h='<div class="week-grid"><div class="time-label" style="grid-row:1"></div>';
  for(let i=0;i<7;i++){const cl=(dates[i]===tod)?'day-label today':'day-label';h+=`<div class="${cl}">${DN[i]}<span>${ms(dates[i])}</span></div>`}
  for(let hh=8;hh<22;hh++)for(let m=0;m<60;m+=30){
    const row=(hh-8)*2+(m/30)+2,ts=String(hh).padStart(2,'0')+':'+String(m).padStart(2,'0');
    h+=`<div class="time-label${m===0?' hour':''}" style="grid-row:${row}">${m===0?ts:''}</div>`;
    for(let d=0;d<7;d++)h+=`<div class="day-col" style="grid-row:${row}" data-date="${dates[d]}" data-time="${ts}"></div>`;
  }
  h+='</div>';c.innerHTML=h;applyBg();const grid=c.querySelector('.week-grid');const now=new Date();
  for(let d=0;d<7;d++){const dc=getForDate(dates[d]);const o=document.createElement('div');o.style.cssText='position:relative;grid-column:'+(d+2)+';grid-row:2/30;pointer-events:none;border-right:2px solid #999;box-sizing:border-box;';
    const hl=document.createElement('div');hl.className='grid-hlines';o.appendChild(hl);
    dc.forEach(co=>{
      const sm=tm(co.startTime)-480,em=tm(co.endTime)-480;
      const top=sm/30*22,ht=Math.max((em-sm)/30*22,22);
      const mk=co.marks&&co.marks[dates[d]]?co.marks[dates[d]]:null;
      const endDt=new Date(dates[d]+'T00:00:00');endDt.setHours(+co.endTime.split(':')[0],+co.endTime.split(':')[1],0,0);
      const needed=(now>endDt&&(!mk||(!mk.completed&&!mk.skipped)));
      const paid=mk?mk.paid:isAutoPaid(co,dates[d]);
      const done=mk?mk.completed:false;
      const skip=mk?mk.skipped:false;
      const bl=document.createElement('div');bl.className='course-block'+(needed?' warn':'');
      bl.style.cssText=`top:${top}px;height:${ht}px;background:${co.color};pointer-events:auto;color:#fff;`;
      bl.dataset.courseId=co.id;bl.dataset.date=dates[d];
      // Build compact content based on block height
      const studentName=sn(co.studentId)||'未指定';
      const orgName=co.organizationId?on(co.organizationId):'';
      let inner='<div class="cb-name">'+co.name+'</div>';
      inner+='<div class="cb-meta">👤'+studentName+(orgName?' · '+orgName:'')+'</div>';
      inner+='<div class="cb-meta">'+co.startTime+'-'+co.endTime+(co.tuition?' · ¥'+co.tuition:'')+'</div>';
      inner+='<div class="cb-status">'+(done?'✅':(skip?'🚫':'⬜'))+(paid?'💰':'')+'</div>';
      inner+='<span class="cb-expand" data-action="expand">▼</span>';
      bl.innerHTML=inner;
      // Click on course block → detail popup
      bl.addEventListener('click',function(e){
        if(e.target.closest('[data-action="expand"]')){
          e.stopPropagation();
          const cb=e.target.closest('.course-block');
          toggleCourseExpand(cb,co,dates[d]);
          return;
        }
        e.stopPropagation();showCourseDetail(co,dates[d]);
      });
      o.appendChild(bl);
    });grid.appendChild(o);
  }
  c.querySelectorAll('.day-col').forEach(cell=>{cell.addEventListener('click',function(){oam(cell.dataset.date,cell.dataset.time)})});
}
function rdv(){const c=D.getElementById('dayView'),tod=today(),dc=getForDate(cdd);
  let h=`<div class="day-header"><button class="week-nav-btn" id="btnDayPrev">◀</button><h2>${md(cdd)} ${DN[dow(cdd)-1]}${cdd===tod?' <small style="color:var(--accent)">今天</small>':''}</h2><button class="week-nav-btn" id="btnDayNext">▶</button></div>`;
  if(!dc.length)h+=`<div class="day-empty"><div class="empty-icon">📭</div>当天没有课程</div>`;
  else{const now=new Date();dc.forEach(co=>{
    const snm=sn(co.studentId),onm=on(co.organizationId);
    const ep=co.endTime.split(':');const endDt=new Date(cdd+'T00:00:00');endDt.setHours(+ep[0],+ep[1],0,0);
    const mk=co.marks&&co.marks[cdd]?co.marks[cdd]:{completed:false,paid:false,skipped:false};
    const needed=now>endDt&&!mk.completed&&!mk.skipped;
    const paid=mk.paid||isAutoPaid(co,cdd);
    const statusText=mk.completed?'✅ 已上课':(mk.skipped?'🚫 不上课':'⬜ 未上课');
    const statusCls=mk.completed?'green':(mk.skipped?'orange':'gray');
    const paidText=paid?'💰 已收':'🔴 未收';
    const paidCls=paid?'green':'red';
    h+=`<div class="day-card${needed?' warn':''}" style="border-left:5px solid ${co.color}" data-id="${co.id}" data-date="${cdd}">
      <div class="dc-time">${co.startTime} - ${co.endTime}${needed?'<span class="dc-time-icon" style="background:#fff3e0;color:#e65100">⚠ 待标记</span>':''}</div>
      <div class="dc-name">${co.name}</div>
      ${snm?`<div class="dc-info"><span class="dc-info-icon">👤</span><span>${snm}</span></div>`:''}
      ${co.location?`<div class="dc-info"><span class="dc-info-icon">📍</span><span>${co.location}</span></div>`:''}
      ${onm?`<div class="dc-info"><span class="dc-info-icon">🏢</span><span>${onm}</span></div>`:''}
      ${co.tuition?`<div class="dc-tuition"><span class="dc-tuition-label">课费</span><span>¥${co.tuition}</span></div>`:''}
      ${co.note?`<div class="dc-info"><span class="dc-info-icon">📌</span><span>${co.note}</span></div>`:''}
      <div class="dc-status">
        <span class="dc-chip ${statusCls}" data-action="cycleStatus">${statusText}</span>
        <span class="dc-chip ${paidCls}" data-action="togglePaid" style="${!mk.completed?'opacity:.4;pointer-events:none;filter:grayscale(1)':''}">${paidText}</span>
      </div>
    </div>`});
  }
  c.innerHTML=h;

function nextStatus(mk){
  if(!mk.completed&&!mk.skipped)return {completed:true,skipped:false};
  if(mk.completed)return {completed:false,skipped:true};
  return {completed:false,skipped:false};
}

function tgm(cid,d,action){
  const c=courses.find(function(x){return x.id===cid});if(!c)return;const now=new Date();
  const ep=c.endTime.split(':');const ed=new Date(d+'T00:00:00');ed.setHours(+ep[0],+ep[1],0,0);
  if(!c.marks)c.marks={};if(!c.marks[d])c.marks[d]={completed:false,paid:false,skipped:false};
  const mk=c.marks[d];
  if(action==='cycleStatus'){
    if(now<=ed){toast('课程尚未结束');return}
    const ns=nextStatus(mk);mk.completed=ns.completed;mk.skipped=ns.skipped;
    if(!mk.completed)mk.paid=false;
    else if(isAutoPaid(c,d))mk.paid=true;
    S(KC,courses);if(cv==='day')rdv();else rwv();rsc();toast(ns.skipped?'标记为不上课':(ns.completed?'标记为已上课':'标记为未上课'));return;
  }
  if(action==='togglePaid'){
    if(!mk.completed){toast('仅已上课的课程可修改收费');return}
    if(now<=ed){toast('课程尚未结束');return}
    mk.paid=!mk.paid;S(KC,courses);if(cv==='day')rdv();else rwv();rsc();toast(mk.paid?'标记为已收':'标记为未收');return;
  }
}

// B3 SVG Bar Chart
function renderChart(byMonth){
  const box=D.getElementById('chartBox');if(!box)return;
  const mode=D.getElementById('chartMode').value;
  const todayMonth=today().slice(0,7);
  // Build last 12 months
  const months=[];const now=new Date();
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');months.push(m)}
  let maxV=0;months.forEach(function(m){const v=byMonth[m]?(byMonth[m].paid+byMonth[m].unpaid):0;if(v>maxV)maxV=v;});
  if(maxV===0)maxV=1000;else maxV=Math.ceil(maxV/100)*100;
  const W=560,H=180,padL=40,padR=10,padT=10,padB=30;
  const cw=W-padL-padR,ch=H-padT-padB;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  // Y axis grid
  for(let i=0;i<=4;i++){const y=padT+ch*(1-i/4);svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+W-padR+'" y2="'+y+'" stroke="#e5e5ea" stroke-width="1"/>';svg+='<text x="'+(padL-4)+'" y="'+y+'" text-anchor="end" font-size="10" fill="#aeaeb2" dominant-baseline="middle">¥'+Math.round(maxV*i/4)+'</text>';}
  // Bars
  const bw=cw/months.length*0.7;
  months.forEach(function(m,idx){
    const x=padL+(cw/months.length)*(idx+0.15);
    const v=byMonth[m]?(byMonth[m].paid+byMonth[m].unpaid):0;
    const paid=byMonth[m]?byMonth[m].paid:0;
    const unpaid=byMonth[m]?byMonth[m].unpaid:0;
    const h=ch*(v/maxV);
    if(mode==='split'){
      const hp=ch*(paid/maxV),hu=ch*(unpaid/maxV);
      svg+='<rect x="'+x+'" y="'+(padT+ch-hp)+'" width="'+bw+'" height="'+hp+'" fill="#4CAF50" rx="2"/>';
      svg+='<rect x="'+x+'" y="'+(padT+ch-hp-hu)+'" width="'+bw+'" height="'+hu+'" fill="#ff9500" rx="2"/>';
    }else{
      const fill=m===todayMonth?'#2196F3':'#4CAF50';
      svg+='<rect x="'+x+'" y="'+(padT+ch-h)+'" width="'+bw+'" height="'+h+'" fill="'+fill+'" rx="2"/>';
    }
    const isHighlight=m===todayMonth;
    if(isHighlight)svg+='<rect x="'+(x-2)+'" y="'+(padT+ch-h-2)+'" width="'+(bw+4)+'" height="'+(h+2)+'" fill="none" stroke="#007aff" stroke-width="2" rx="3"/>';
    // Label
    svg+='<text x="'+(x+bw/2)+'" y="'+(H-padB+14)+'" text-anchor="middle" font-size="9" fill="'+(isHighlight?'#007aff':'#aeaeb2')+'">'+m.slice(5)+'</text>';
  });
  svg+='</svg>';
  if(mode==='split'){svg+='<div style="display:flex;gap:14px;font-size:11px;margin-top:6px;justify-content:center;color:var(--text2)"><span><span style="display:inline-block;width:10px;height:10px;background:#4CAF50;border-radius:2px;margin-right:4px"></span>已收</span><span><span style="display:inline-block;width:10px;height:10px;background:#ff9500;border-radius:2px;margin-right:4px"></span>未收</span></div>';}
  box.innerHTML=svg;
}
