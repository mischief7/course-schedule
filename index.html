<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="课程表">
<meta name="theme-color" content="#1d1d1f">
<meta name="description" content="教师课程表">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%234CAF50'/><text x='90' y='115' text-anchor='middle' font-size='100' font-family='sans-serif'>📅</text></svg>">
<title>课程表</title>
<style>
:root{
  --bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--text2:#6e6e73;--text3:#aeaeb2;
  --border:#e5e5ea;--accent:#4CAF50;--accent-hover:#43a047;--danger:#ff3b30;
  --warning:#ff9500;--blue:#007aff;--shadow:0 2px 12px rgba(0,0,0,.08);
  --radius:14px;--radius-sm:10px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --tab-h:calc(56px + var(--safe-bottom));
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);height:100%;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  transition:background-image .5s;
}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:16px;color:var(--text);-webkit-appearance:none;appearance:none}
select{-webkit-appearance:auto;appearance:auto;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;width:100%}
input[type=time],input[type=date]{min-height:44px}
input[type=time]::-webkit-calendar-picker-indicator,input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.5);margin-left:auto}
#app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top)+6px) 16px 6px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.header h1{font-size:18px;font-weight:700}
.btn-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s;flex-shrink:0}
.btn-icon:active{background:var(--border)}
.btn-sm{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:600;background:var(--accent);color:#fff}
.btn-sm-outline{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:600;border:1.5px solid var(--border);color:var(--text)}
.week-nav{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;background:var(--surface);flex-shrink:0;border-bottom:1px solid var(--border)}
.week-nav-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--bg)}
.week-nav-btn:active{background:var(--border)}
.week-nav-info{font-size:13px;font-weight:600;text-align:center;min-width:160px}
.btn-today{font-size:11px;padding:4px 10px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}
.view-toggle{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.view-toggle button{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2);transition:all .2s}
.view-toggle button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--tab-h)+10px)}
.page{display:none}
.page.active{display:block}

/* Schedule */
#weekView{padding:4px 4px 20px}
.week-grid{display:grid;grid-template-columns:44px repeat(7,1fr)}
.day-label{background:var(--surface);text-align:center;padding:6px 2px;font-size:10px;font-weight:600;border-bottom:2px solid var(--border);line-height:1.3}
.day-label span{display:block;font-size:9px;color:var(--text2);font-weight:400}
.day-label.today{border-bottom-color:var(--accent);color:var(--accent)}
.day-label.today span{color:var(--accent)}
.time-label{font-size:8px;color:var(--text3);text-align:right;padding:0 3px 0 0;height:6px;line-height:6px}
.day-col{position:relative;min-height:6px}
.course-block{position:absolute;left:1px;right:1px;border-radius:4px;padding:2px 3px;font-size:9px;line-height:1.2;overflow:hidden;cursor:pointer;color:#fff;font-weight:600;z-index:2;border-left:2px solid rgba(255,255,255,.3)}
.course-block:active{transform:scale(.97)}
.course-block .c-name{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-block .c-detail{font-size:7px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-block .c-marks{position:absolute;right:3px;top:2px;font-size:7px;opacity:.9}

/* Day view */
#dayView{padding:8px 12px 20px}
.day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.day-header h2{font-size:17px;font-weight:700}
.day-card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.day-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.day-card .dc-time{font-size:14px;font-weight:700;margin-bottom:4px}
.day-card .dc-name{font-size:16px;font-weight:600;margin-bottom:3px}
.day-card .dc-info{font-size:12px;color:var(--text2);margin-bottom:1px}
.day-card .dc-tuition{font-size:12px;font-weight:600;color:#e65100}
.day-card .dc-marks{display:flex;gap:8px;margin-top:6px}
.day-card .dc-mark{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg);display:flex;align-items:center;gap:3px;cursor:pointer}
.day-card .dc-mark.done{background:#e8f5e9;color:#2e7d32}
.day-card .dc-mark.pending{background:#fff3e0;color:#e65100}
.day-empty{text-align:center;padding:60px 20px;color:var(--text3)}
.day-empty .empty-icon{font-size:48px;margin-bottom:12px}

/* Footer */
.schedule-footer{display:flex;gap:10px;padding:8px 16px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}

/* Tab Bar */
.tab-bar{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:var(--safe-bottom)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0 4px;font-size:10px;color:var(--text3);transition:color .15s}
.tab-item .tab-icon{font-size:20px;margin-bottom:1px}
.tab-item.active{color:var(--accent)}

/* List cards */
.list-item{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin:6px 12px;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:pointer;display:flex;align-items:center;gap:12px}
.list-item .li-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.list-item .li-info{flex:1;min-width:0}
.list-item .li-name{font-size:15px;font-weight:600}
.list-item .li-sub{font-size:12px;color:var(--text2);margin-top:2px}
.list-item .li-arrow{color:var(--text3);font-size:14px}
.section-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.section-hd h3{font-size:14px;font-weight:700}
.empty-state{text-align:center;padding:50px 20px;color:var(--text3);font-size:13px;line-height:1.8}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);width:100%;max-width:600px;max-height:90vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideUp .25s;padding-bottom:var(--safe-bottom)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:17px;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px}
.modal-footer{display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--border)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg)}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);outline:none}
.form-row{display:flex;gap:10px}.form-row .form-group{flex:1}
.req{color:var(--danger)}.hint{font-size:10px;color:var(--text2);margin-top:3px}
.repeat-row{padding:10px 14px;background:var(--bg);border-radius:var(--radius-sm);margin:8px 0}
.color-picker{display:flex;gap:6px;flex-wrap:wrap}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color-dot.selected{border-color:var(--text);box-shadow:0 0 0 3px rgba(0,0,0,.1)}
.btn-primary{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;background:var(--accent);color:#fff;text-align:center}
.btn-secondary{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;background:var(--bg);color:var(--text);text-align:center}
.btn-danger{color:var(--danger);font-weight:600;font-size:14px}
.btn-save{padding:10px 28px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;background:var(--accent);color:#fff}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;white-space:nowrap;animation:toastIn .3s,toastOut .3s 2s forwards;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

.course-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.course-chip{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;color:#fff;cursor:pointer}
.export-preview{background:var(--bg);border-radius:var(--radius-sm);padding:14px;font-size:12px;line-height:1.8;white-space:pre-wrap;max-height:60vh;overflow-y:auto;margin-top:10px;font-family:monospace}
#importFile{display:none}
.install-banner{position:fixed;bottom:100px;left:16px;right:16px;z-index:90;background:var(--surface);border-radius:var(--radius);padding:14px 18px;box-shadow:0 4px 24px rgba(0,0,0,.15);display:flex;align-items:center;gap:12px;animation:slideUp .3s}
.install-banner .ib-text{flex:1;font-size:13px;font-weight:600}
.install-banner .ib-btn{padding:8px 16px;border-radius:16px;background:var(--accent);color:#fff;font-size:13px;font-weight:600}
.search-bar{padding:8px 12px}
.search-bar input{width:100%;padding:10px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header class="header" id="mainHeader">
    <h1 id="headerTitle">📅 课程表</h1>
    <div class="header-actions" id="headerActions">
      <div class="view-toggle" id="viewToggle">
        <button data-view="week" class="active">周</button>
        <button data-view="day">日</button>
      </div>
    </div>
  </header>

  <nav class="week-nav" id="weekNav">
    <button class="week-nav-btn" id="btnPrev">◀</button>
    <div class="week-nav-info" id="weekInfo">加载中...</div>
    <button class="week-nav-btn" id="btnNext">▶</button>
    <button class="btn-today" id="btnToday">今天</button>
  </nav>

  <main class="main-content" id="mainContent">
    <!-- Schedule Tab -->
    <div id="pageSchedule" class="page active">
      <div id="weekView"></div>
      <div id="dayView" style="display:none"></div>
    </div>
    <!-- Students Tab -->
    <div id="pageStudents" class="page">
      <div class="section-hd"><h3>学生列表</h3><button class="btn-sm" id="btnAddStudent">+ 添加</button></div>
      <div class="search-bar"><input type="text" id="studentSearch" placeholder="搜索学生..."></div>
      <div id="studentList"></div>
      <div id="studentDetail" style="display:none">
        <div class="section-hd">
          <button class="btn-sm-outline" id="btnStudentBack">← 返回</button>
          <div style="display:flex;gap:6px">
            <button class="btn-sm-outline" id="btnStudentExport">📤 导出课程</button>
            <button class="btn-sm" id="btnStudentEdit">编辑</button>
          </div>
        </div>
        <div id="studentDetailContent"></div>
      </div>
    </div>
    <!-- Orgs Tab -->
    <div id="pageOrgs" class="page">
      <div class="section-hd"><h3>机构列表</h3><button class="btn-sm" id="btnAddOrg">+ 添加</button></div>
      <div class="search-bar"><input type="text" id="orgSearch" placeholder="搜索机构..."></div>
      <div id="orgList"></div>
      <div id="orgDetail" style="display:none">
        <div class="section-hd">
          <button class="btn-sm-outline" id="btnOrgBack">← 返回</button>
          <button class="btn-sm" id="btnOrgEdit">编辑</button>
        </div>
        <div id="orgDetailContent"></div>
      </div>
    </div>
    <!-- Settings Tab -->
    <div id="pageSettings" class="page">
      <div style="padding:12px 16px">
        <div class="form-group"><label>课程表名称</label><input type="text" id="sName" placeholder="我的课程表"></div>
        <div class="form-group"><label>背景图（可选）</label>
          <input type="file" id="bgFile" accept="image/*" style="padding:8px 0;border:none;background:none"> <span class="hint" id="bgStatus"></span>
          <button class="btn-sm-outline" id="btnRemoveBg" style="margin-top:4px;display:none">移除背景图</button>
        </div>
        <button class="btn-primary" id="btnSaveSettingsCfg" style="width:100%;margin-bottom:20px">保存设置</button>
        <h3 style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">数据管理</h3>
        <div style="background:var(--bg);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:10px">
          <button class="btn-primary" id="btnExportDataS" style="width:100%;background:var(--bg);color:var(--text);margin-bottom:1px;border-radius:0">📤 导出全部数据 (JSON)</button>
          <button class="btn-primary" id="btnImportDataS" style="width:100%;background:var(--bg);color:var(--text);margin-bottom:1px;border-radius:0">📥 导入数据恢复 (JSON)</button>
          <button class="btn-primary" id="btnClearAllS" style="width:100%;background:var(--bg);color:var(--danger);border-radius:0">🗑 清空所有数据</button>
        </div>
        <input type="file" id="importFile" accept=".json">
      </div>
    </div>
  </main>

  <!-- Schedule Footer -->
  <div class="schedule-footer" id="scheduleFooter">
    <button class="btn-primary" id="btnAddCourse">+ 添加课程</button>
    <button class="btn-secondary" id="btnExport">📥 导出日历</button>
  </div>

  <!-- Tab Bar -->
  <nav class="tab-bar" id="tabBar">
    <button class="tab-item active" data-tab="schedule"><span class="tab-icon">📅</span>课程表</button>
    <button class="tab-item" data-tab="students"><span class="tab-icon">👨‍🎓</span>学生</button>
    <button class="tab-item" data-tab="orgs"><span class="tab-icon">🏢</span>机构</button>
    <button class="tab-item" data-tab="settings"><span class="tab-icon">⚙</span>设置</button>
  </nav>
</div>

<!-- COURSE MODAL -->
<div class="modal-overlay" id="courseModal" style="display:none"><div class="modal">
  <div class="modal-header"><h2 id="modalTitle">添加课程</h2><button class="btn-icon" id="btnCloseModal">✕</button></div>
  <div class="modal-body">
    <input type="hidden" id="courseId">
    <div class="form-group"><label>课程名称 <span class="req">*</span></label><input type="text" id="cName"></div>
    <div class="form-row">
      <div class="form-group"><label>学生 <span class="req">*</span></label><select id="cStudentId"></select></div>
      <div class="form-group"><label>机构</label><select id="cOrgId"><option value="">暂不选择</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>上课地点</label><input type="text" id="cLocation"></div>
      <div class="form-group"><label>学费 (RMB) <span class="req">*</span></label><input type="number" id="cTuition" min="0" step="0.01"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>上课日期 <span class="req">*</span></label><input type="date" id="cDate"></div>
      <div class="form-group"><label>颜色</label><div class="color-picker" id="colorPicker"></div><input type="hidden" id="cColor" value="#4CAF50"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>开始时间 <span class="req">*</span></label><input type="time" id="cStart" step="300" value="09:00"></div>
      <div class="form-group"><label>结束时间 <span class="req">*</span></label><input type="time" id="cEnd" step="300" value="10:00"></div>
    </div>
    <div class="repeat-row">
      <div class="form-group"><label>重复模式</label><select id="cRepeat"><option value="none">不重复</option><option value="weekly">每周重复</option></select></div>
      <div class="form-group" id="repeatUntilGroup" style="display:none;margin-top:8px"><label>截止日期 <span class="req">*</span></label><input type="date" id="cRepeatUntil"><div class="hint">从上课日期起每周重复至截止日期</div></div>
    </div>
    <div class="form-group"><label>备注</label><input type="text" id="cNote"></div>
  </div>
  <div class="modal-footer">
    <button class="btn-danger" id="btnDelete" style="display:none">删除课程</button>
    <div style="flex:1"></div>
    <button class="btn-secondary" id="btnCancel">取消</button>
    <button class="btn-save" id="btnSave">保存</button>
  </div>
</div></div>

<!-- STUDENT MODAL -->
<div class="modal-overlay" id="studentModal" style="display:none"><div class="modal">
  <div class="modal-header"><h2 id="studentModalTitle">添加学生</h2><button class="btn-icon" id="btnCloseStudentModal">✕</button></div>
  <div class="modal-body">
    <input type="hidden" id="studentId">
    <div class="form-group"><label>姓名 <span class="req">*</span></label><input type="text" id="sNameI"></div>
    <div class="form-row">
      <div class="form-group"><label>年龄</label><input type="number" id="sAge" min="1" max="120"></div>
      <div class="form-group"><label>学习基础</label><input type="text" id="sLevel" placeholder="如：零基础"></div>
    </div>
    <div class="form-group"><label>所属机构</label><select id="sOrgId"><option value="">无</option></select></div>
  </div>
  <div class="modal-footer">
    <button class="btn-danger" id="btnDeleteStudent" style="display:none">删除学生</button>
    <div style="flex:1"></div>
    <button class="btn-secondary" id="btnCancelStudent">取消</button>
    <button class="btn-save" id="btnSaveStudent">保存</button>
  </div>
</div></div>

<!-- ORG MODAL -->
<div class="modal-overlay" id="orgModal" style="display:none"><div class="modal">
  <div class="modal-header"><h2 id="orgModalTitle">添加机构</h2><button class="btn-icon" id="btnCloseOrgModal">✕</button></div>
  <div class="modal-body">
    <input type="hidden" id="orgId">
    <div class="form-group"><label>名称 <span class="req">*</span></label><input type="text" id="oNameI"></div>
    <div class="form-row">
      <div class="form-group"><label>位置</label><input type="text" id="oLocation"></div>
      <div class="form-group"><label>校区</label><input type="text" id="oCampus"></div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-danger" id="btnDeleteOrg" style="display:none">删除机构</button>
    <div style="flex:1"></div>
    <button class="btn-secondary" id="btnCancelOrg">取消</button>
    <button class="btn-save" id="btnSaveOrg">保存</button>
  </div>
</div></div>

<!-- EXPORT MODAL -->
<div class="modal-overlay" id="exportModal" style="display:none"><div class="modal">
  <div class="modal-header"><h2>导出学生课程</h2><button class="btn-icon" id="btnCloseExport">✕</button></div>
  <div class="modal-body">
    <div class="form-row">
      <div class="form-group"><label>起始日期</label><input type="date" id="expStart"></div>
      <div class="form-group"><label>结束日期</label><input type="date" id="expEnd"></div>
    </div>
    <div class="export-preview" id="exportPreview"></div>
  </div>
  <div class="modal-footer">
    <button class="btn-secondary" id="btnCopyExport">📋 复制</button>
    <button class="btn-save" id="btnShareExport">📤 分享</button>
  </div>
</div></div>

<div id="toastContainer"></div>
<div class="install-banner" id="installBanner" style="display:none"><span style="font-size:28px">📅</span><span class="ib-text">添加到主屏幕，像App一样使用</span><button class="ib-btn" id="btnInstall">添加</button></div>

<script>
// ============================================================
// DATA LAYER
// ============================================================
const A='_v3',SK_C='schedule_courses'+A,SK_S='schedule_students'+A,SK_O='schedule_orgs'+A,SK_CF='schedule_config'+A;
const DEF_COLORS=['#4CAF50','#2196F3','#FF9800','#E91E63','#9C27B0','#00BCD4','#FF5722','#607D8B','#795548','#3F51B5'];
const DAY_NAMES=['周一','周二','周三','周四','周五','��六','周日'];
const D=document;

function load(k,dflt){try{const v=JSON.parse(localStorage.getItem(k));return v===null||v===undefined?dflt:v}catch(e){return dflt}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}

// Migrate from V2
(function migrate(){
  const v2k='schedule_courses_v2',v2c='schedule_config_v2';
  const old=load(v2k,null);
  if(!old||!localStorage.getItem(v2k))return;
  const orgs=load(SK_O,[]),students=load(SK_S,[]);
  // Take old courses, convert student/org strings to references
  const migrated=old.map(c=>{
    let sid='',oid='';
    if(c.student){let s=students.find(x=>x.name===c.student);if(!s){s={id:genId(),name:c.student,age:0,level:'',organizationId:''};students.push(s)}sid=s.id}
    if(c.organization){let o=orgs.find(x=>x.name===c.organization);if(!o){o={id:genId(),name:c.organization,location:'',campus:''};orgs.push(o)}oid=o.id}
    const {student,organization,teacher,classroom,dayOfWeek,weekStart,weekEnd,...rest}=c;
    return {...rest,studentId:sid,organizationId:oid,marks:c.marks||{}};
  });
  save(SK_C,migrated);save(SK_S,students);save(SK_O,orgs);
  localStorage.removeItem(v2k);localStorage.removeItem(v2c);
  toast('已迁移 '+migrated.length+' 门旧版课程');
})();

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
let courses=load(SK_C,[]),students=load(SK_S,[]),orgs=load(SK_O,[]),config=load(SK_CF,{scheduleName:'我的课程表',bgImage:''});

// ============================================================
// DATE UTILS
// ============================================================
function td(s){if(!s||typeof s!=='string')return new Date();const p=s.split('-');if(p.length!==3||isNaN(+p[0])||isNaN(+p[1])||isNaN(+p[2]))return new Date();return new Date(+p[0],+p[1]-1,+p[2])}
function ds(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ad(s,n){s=s||ds();const d=td(s);d.setDate(d.getDate()+(+n||0));return ds(d)}
function dow(s){return td(s).getDay()||7}
function monday(s){s=s||ds();const d=td(s);d.setDate(d.getDate()-(d.getDay()||7)+1);return ds(d)}
function today(){return ds(new Date())}
function fmtMD(s){const d=td(s),m=d.getMonth()+1;return (m)+'月'+d.getDate()+'日'}
function fmtMDS(s){const d=td(s);return (d.getMonth()+1)+'/'+d.getDate()}
function tm(t){const[p,m]=t.split(':').map(Number);return p*60+m}

// ============================================================
// COURSE UTILS
// ============================================================
function getCoursesForDate(targetDate){
  return courses.filter(c=>{
    if(c.date===targetDate)return true;
    if(c.repeat==='weekly'&&c.repeatUntil&&targetDate>=c.date&&targetDate<=c.repeatUntil&&dow(c.date)===dow(targetDate))return true;
    return false;
  }).sort((a,b)=>tm(a.startTime)-tm(b.startTime));
}
function getExpandedDates(course){
  const dates=[];
  if(course.repeat==='weekly'&&course.repeatUntil){let d=course.date;while(d<=course.repeatUntil){dates.push(d);d=ad(d,7)}}
  else dates.push(course.date);
  return dates;
}
function getStudentName(sid){const s=students.find(x=>x.id===sid);return s?s.name:''}
function getOrgName(oid){const o=orgs.find(x=>x.id===oid);return o?o.name+((o.campus)?' - '+o.campus:''):''}
function getOrgById(oid){return orgs.find(x=>x.id===oid)||null}

// ============================================================
// STATE
// ============================================================
let currentWeekStart=monday(today()),currentDayDate=today(),currentView='week',activeTab='schedule';
let editingId=null,sEditingId=null,oEditingId=null,expStudentId=null,deferredInstallPrompt=null;

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tab){
  activeTab=tab;
  D.querySelectorAll('.tab-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  D.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page'+(tab.charAt(0).toUpperCase()+tab.slice(1)).replace('Settings','Settings').replace('schedule','Schedule').replace('students','Students').replace('orgs','Orgs')));
  // Simplified:
  document.getElementById('pageSchedule').classList.toggle('active',tab==='schedule');
  document.getElementById('pageStudents').classList.toggle('active',tab==='students');
  document.getElementById('pageOrgs').classList.toggle('active',tab==='orgs');
  document.getElementById('pageSettings').classList.toggle('active',tab==='settings');
  D.getElementById('weekNav').style.display=tab==='schedule'?'flex':'none';
  D.getElementById('scheduleFooter').style.display=tab==='schedule'?'flex':'none';
  D.getElementById('viewToggle').style.display=tab==='schedule'?'':'none';
  D.getElementById('headerTitle').textContent={'schedule':'📅 课程表','students':'👨‍🎓 学生管理','orgs':'🏢 机构管理','settings':'⚙ 设置'}[tab];
  if(tab==='schedule'){if(currentView==='week')renderWeekView();else renderDayView()}
  else if(tab==='students')renderStudentList();
  else if(tab==='orgs')renderOrgList();
  else if(tab==='settings')renderSettings();
}

// ============================================================
// WEEK VIEW
// ============================================================
function renderWeekView(){
  const container=D.getElementById('weekView'),tod=today();
  const dates=[];for(let i=0;i<7;i++)dates.push(ad(currentWeekStart,i));
  let html='<div class="week-grid"><div class="time-label" style="grid-row:1"></div>';
  for(let i=0;i<7;i++){
    const cls=(dates[i]===tod)?'day-label today':'day-label';
    html+=`<div class="${cls}">${DAY_NAMES[i]}<span>${fmtMDS(dates[i])}</span></div>`;
  }
  for(let h=8;h<21;h++)for(let m=0;m<60;m+=5){
    const row=(h-8)*12+(m/5)+2,ts=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    html+=`<div class="time-label" style="grid-row:${row}">${m===0?ts:''}</div>`;
    for(let d=0;d<7;d++)html+=`<div class="day-col" style="grid-row:${row}" data-date="${dates[d]}" data-time="${ts}"></div>`;
  }
  html+='</div>';container.innerHTML=html;
  const grid=container.querySelector('.week-grid');
  for(let d=0;d<7;d++){
    const dayCourses=getCoursesForDate(dates[d]);if(!dayCourses.length)continue;
    const overlay=document.createElement('div');
    overlay.style.cssText='position:relative;grid-column:'+(d+2)+';grid-row:2/158;pointer-events:none;';
    dayCourses.forEach(c=>{
      const sm=tm(c.startTime)-480,em=tm(c.endTime)-480;
      const top=sm/5*6,height=Math.max((em-sm)/5*6,10);
      const studentName=getStudentName(c.studentId);
      const mark=c.marks&&c.marks[dates[d]]?c.marks[dates[d]]:null;
      const markIcons=mark?((mark.c?'✅':'')+(mark.p?'💵':'')):'';
      const block=document.createElement('div');
      block.className='course-block';
      block.style.cssText=`top:${top}px;height:${height}px;background:${c.color};pointer-events:auto;`;
      block.innerHTML=`<div class="c-name">${c.name} ${markIcons}</div><div class="c-detail">${c.startTime}-${c.endTime} ${studentName}${c.location?' · '+c.location:''}</div>`;
      block.addEventListener('click',(e)=>{e.stopPropagation();openEditModal(c.id)});
      overlay.appendChild(block);
    });
    grid.appendChild(overlay);
  }
  container.querySelectorAll('.day-col').forEach(cell=>{
    cell.addEventListener('click',()=>{openAddModal(cell.dataset.date,cell.dataset.time)});
  });
}

// ============================================================
// DAY VIEW
// ============================================================
function renderDayView(){
  const container=D.getElementById('dayView'),tod=today();
  const dayCourses=getCoursesForDate(currentDayDate);
  let html=`<div class="day-header"><button class="week-nav-btn" id="btnDayPrev">◀</button><h2>${fmtMD(currentDayDate)} ${DAY_NAMES[dow(currentDayDate)-1]}${currentDayDate===tod?' <small style="color:var(--accent)">今天</small>':''}</h2><button class="week-nav-btn" id="btnDayNext">▶</button></div>`;
  if(!dayCourses.length)html+=`<div class="day-empty"><div class="empty-icon">📭</div>当天没有课程</div>`;
  else dayCourses.forEach(c=>{
    const studentName=getStudentName(c.studentId),orgName=getOrgName(c.organizationId);
    const now=new Date();const endParts=c.endTime.split(':');const endDt=new Date(currentDayDate+'T00:00:00');endDt.setHours(+endParts[0],+endParts[1],0,0);
    const canMark=now>endDt;
    const mark=c.marks&&c.marks[currentDayDate]?c.marks[currentDayDate]:{c:false,p:false};
    html+=`<div class="day-card" style="--c:${c.color}" data-id="${c.id}" data-date="${currentDayDate}">
      <div class="dc-time">${c.startTime} - ${c.endTime}</div>
      <div class="dc-name" style="color:${c.color}">${c.name}</div>
      ${studentName?`<div class="dc-info">👤 ${studentName}${c.location?' · 📍'+c.location:''}</div>`:''}
      ${orgName?`<div class="dc-info">🏢 ${orgName}</div>`:''}
      ${c.tuition?`<div class="dc-tuition">💰 ¥${c.tuition}</div>`:''}
      ${c.note?`<div class="dc-info">📌 ${c.note}</div>`:''}
      <div class="dc-marks">
        <span class="dc-mark ${mark.c?'done':''} ${!canMark?'':''}" data-action="toggleComplete" data-id="${c.id}" data-date="${currentDayDate}" style="${canMark?'':'opacity:.5;pointer-events:none'}">${mark.c?'✅':'⬜'} ${mark.c?'已完成':'未完成'}</span>
        <span class="dc-mark ${mark.p?'done':''} ${!canMark?'':''}" data-action="togglePaid" data-id="${c.id}" data-date="${currentDayDate}" style="${canMark?'':'opacity:.5;pointer-events:none'}">${mark.p?'💵':'⬜'} ${mark.p?'已发薪':'未发薪'}</span>
      </div>
    </div>`;
  });
  container.innerHTML=html;
  container.querySelectorAll('.day-card').forEach(card=>{
    card.addEventListener('click',e=>{if(!e.target.closest('.dc-mark'))openEditModal(card.dataset.id)});
  });
  container.querySelectorAll('.dc-mark').forEach(mark=>{
    mark.addEventListener('click',e=>{e.stopPropagation();toggleMark(mark.dataset.id,mark.dataset.date,mark.dataset.action)});
  });
  D.getElementById('btnDayPrev').addEventListener('click',()=>{currentDayDate=ad(currentDayDate,-1);renderDayView()});
  D.getElementById('btnDayNext').addEventListener('click',()=>{currentDayDate=ad(currentDayDate,1);renderDayView()});
}
const dcs=document.createElement('style');dcs.textContent='.day-card::before{background:var(--c)}';document.head.appendChild(dcs);

function toggleMark(cid,d,action){
  const c=courses.find(x=>x.id===cid);if(!c)return;
  const now=new Date();const endParts=c.endTime.split(':');const endDt=new Date(d+'T00:00:00');endDt.setHours(+endParts[0],+endParts[1],0,0);
  if(now<=endDt){toast('课程尚未结束，无法修改标记');return}
  if(!c.marks)c.marks={};
  if(!c.marks[d])c.marks[d]={c:false,p:false};
  if(action==='toggleComplete')c.marks[d].c=!c.marks[d].c;
  else c.marks[d].p=!c.marks[d].p;
  save(SK_C,courses);renderDayView();toast('标记已更新');
}

// ============================================================
// NAVIGATION
// ============================================================
function updateWeekNav(){
  D.getElementById('weekInfo').textContent=fmtMD(currentWeekStart)+' - '+fmtMD(ad(currentWeekStart,6));
}
function goWeek(delta){currentWeekStart=ad(currentWeekStart,delta*7);updateWeekNav();if(currentView==='week')renderWeekView();else{currentDayDate=ad(currentDayDate,delta*7);renderDayView()}}
function goToday(){currentWeekStart=monday(today());currentDayDate=today();updateWeekNav();if(currentView==='week')renderWeekView();else renderDayView()}
function switchView(view){currentView=view;D.getElementById('weekView').style.display=view==='week'?'block':'none';D.getElementById('dayView').style.display=view==='day'?'block':'none';D.querySelectorAll('#viewToggle button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='day')currentDayDate=currentWeekStart;if(view==='week')renderWeekView();else renderDayView()}

// ============================================================
// STUDENT LIST & DETAIL
// ============================================================
function renderStudentList(q){
  q=(q||'').toLowerCase();
  const filtered=students.filter(s=>!q||s.name.toLowerCase().includes(q)||(s.level||'').toLowerCase().includes(q));
  const container=D.getElementById('studentList'),detail=D.getElementById('studentDetail');
  detail.style.display='none';container.style.display='block';
  if(!filtered.length){container.innerHTML=`<div class="empty-state">暂无学生<br><small>点击右上角 "+" 添加</small></div>`;return}
  container.innerHTML=filtered.map(s=>{
    const orgName=getOrgName(s.organizationId);
    const courseCount=courses.filter(c=>c.studentId===s.id).length;
    return `<div class="list-item" data-sid="${s.id}"><div class="li-avatar" style="background:${DEF_COLORS[Math.abs(s.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%DEF_COLORS.length]}">${s.name[0]}</div><div class="li-info"><div class="li-name">${s.name}</div><div class="li-sub">${[s.age?s.age+'岁':'',s.level||'',orgName||''].filter(Boolean).join(' · ')} · ${courseCount}门课程</div></div><div class="li-arrow">›</div></div>`;
  }).join('');
  container.querySelectorAll('.list-item').forEach(item=>{item.addEventListener('click',()=>renderStudentDetail(item.dataset.sid))});
}
function renderStudentDetail(sid){
  const s=students.find(x=>x.id===sid);if(!s)return;
  const container=D.getElementById('studentList'),detail=D.getElementById('studentDetail'),content=D.getElementById('studentDetailContent');
  container.style.display='none';detail.style.display='block';expStudentId=sid;
  const orgName=getOrgName(s.organizationId);
  const sCourses=courses.filter(c=>c.studentId===sid).sort((a,b)=>a.date.localeCompare(b.date)||tm(a.startTime)-tm(b.startTime));
  const now=ds();
  const upcoming=sCourses.filter(c=>{const dates=getExpandedDates(c);return dates.some(d=>d>=now)});
  let html=`<div style="padding:12px 16px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><div style="width:48px;height:48px;border-radius:50%;background:${DEF_COLORS[Math.abs(s.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%DEF_COLORS.length]};color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700">${s.name[0]}</div><div><div style="font-size:18px;font-weight:700">${s.name}</div><div style="font-size:12px;color:var(--text2);margin-top:2px">${[s.age?s.age+'岁':'',s.level?'基础:'+s.level:'',orgName||''].filter(Boolean).join(' · ')}</div></div></div>`;
  html+=`<div style="font-size:13px;font-weight:700;margin-bottom:8px">📚 课程列表 (${sCourses.length}门)</div>`;
  if(!sCourses.length)html+=`<div style="color:var(--text3);padding:20px 0">暂无课程</div>`;
  else sCourses.forEach(c=>{
    const dates=getExpandedDates(c);
    html+=`<div style="padding:8px 12px;margin:4px 0;background:var(--bg);border-radius:8px;border-left:3px solid ${c.color};font-size:12px"><div style="font-weight:600">${c.name}</div><div style="color:var(--text2)">${fmtMD(c.date)} ${c.startTime}-${c.endTime}${c.repeat==='weekly'?' · 每周重复至'+fmtMD(c.repeatUntil):''}</div><div style="color:var(--text2)">${c.location?'📍'+c.location+' ':''}💰¥${c.tuition}${c.organizationId?' · '+getOrgName(c.organizationId):''}</div></div>`;
  });
  html+=`</div>`;content.innerHTML=html;
}
function openStudentModal(sid){
  sEditingId=sid||null;
  D.getElementById('studentModalTitle').textContent=sid?'编辑学生':'添加学生';
  D.getElementById('btnDeleteStudent').style.display=sid?'block':'none';
  D.getElementById('studentId').value=sid||'';
  if(sid){const s=students.find(x=>x.id===sid);if(!s)return;D.getElementById('sNameI').value=s.name;D.getElementById('sAge').value=s.age||'';D.getElementById('sLevel').value=s.level||'';D.getElementById('sOrgId').value=s.organizationId||''}
  else{D.getElementById('sNameI').value='';D.getElementById('sAge').value='';D.getElementById('sLevel').value='';D.getElementById('sOrgId').value=''}
  populateOrgDropdown('sOrgId',true);
  D.getElementById('studentModal').style.display='flex';
}
function saveStudent(){
  const name=D.getElementById('sNameI').value.trim();if(!name){toast('请输入学生姓名');return}
  if(sEditingId){const dup=students.find(x=>x.name===name&&x.id!==sEditingId);if(dup){toast('学生姓名已存在');return}}
  else{if(students.find(x=>x.name===name)){toast('学生姓名已存在');return}}
  const student={id:sEditingId||genId(),name,age:parseInt(D.getElementById('sAge').value)||0,level:D.getElementById('sLevel').value.trim(),organizationId:D.getElementById('sOrgId').value};
  if(sEditingId)students=students.map(x=>x.id===sEditingId?student:x);else students.push(student);
  save(SK_S,students);D.getElementById('studentModal').style.display='none';renderStudentList();toast(sEditingId?'学生已更新':'学生已添加');
}
function deleteStudent(){
  if(!sEditingId)return;const count=courses.filter(c=>c.studentId===sEditingId).length;
  const msg=count?`该学生有${count}门关联课程，删除后课程的学生信息将丢失。确定删除？`:'确定删除该学生？';
  if(!confirm(msg))return;courses=courses.map(c=>c.studentId===sEditingId?{...c,studentId:''}:c);save(SK_C,courses);
  students=students.filter(x=>x.id!==sEditingId);save(SK_S,students);D.getElementById('studentModal').style.display='none';renderStudentList();toast('学生已删���');
}

// ============================================================
// ORG LIST & DETAIL
// ============================================================
function renderOrgList(q){
  q=(q||'').toLowerCase();
  const filtered=orgs.filter(o=>!q||o.name.toLowerCase().includes(q)||(o.campus||'').toLowerCase().includes(q)||(o.location||'').toLowerCase().includes(q));
  const container=D.getElementById('orgList'),detail=D.getElementById('orgDetail');
  detail.style.display='none';container.style.display='block';
  if(!filtered.length){container.innerHTML=`<div class="empty-state">暂无机构<br><small>点击右上角 "+" 添加</small></div>`;return}
  container.innerHTML=filtered.map(o=>{
    const cc=courses.filter(c=>c.organizationId===o.id).length;
    const sc=students.filter(s=>s.organizationId===o.id).length;
    return `<div class="list-item" data-oid="${o.id}"><div class="li-avatar" style="background:${DEF_COLORS[Math.abs(o.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%DEF_COLORS.length]}">${o.name[0]}</div><div class="li-info"><div class="li-name">${o.name}${o.campus?' · '+o.campus:''}</div><div class="li-sub">${o.location||''} · ${cc}门课程 · ${sc}名学生</div></div><div class="li-arrow">›</div></div>`;
  }).join('');
  container.querySelectorAll('.list-item').forEach(item=>{item.addEventListener('click',()=>renderOrgDetail(item.dataset.oid))});

function renderOrgDetail(oid){
  const o=orgs.find(x=>x.id===oid);if(!o)return;
  const container=D.getElementById('orgList'),detail=D.getElementById('orgDetail'),content=D.getElementById('orgDetailContent');
  content.dataset.oid=oid;container.style.display='none';detail.style.display='block';
  const oStudents=students.filter(s=>s.organizationId===oid);
  const oCourses=courses.filter(c=>c.organizationId===oid).sort((a,b)=>a.date.localeCompare(b.date)||tm(a.startTime)-tm(b.startTime));
  let html=`<div style="padding:12px 16px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><div style="width:48px;height:48px;border-radius:50%;background:${DEF_COLORS[Math.abs(o.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%DEF_COLORS.length]};color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700">${o.name[0]}</div><div><div style="font-size:18px;font-weight:700">${o.name}${o.campus?' · '+o.campus:''}</div><div style="font-size:12px;color:var(--text2);margin-top:2px">${o.location||''} · ${oStudents.length}名学生 · ${oCourses.length}门课程</div></div></div>`;
  if(oStudents.length){html+=`<div style="font-size:13px;font-weight:700;margin-bottom:6px">👨‍🎓 学生</div>`;oStudents.forEach(s=>{html+=`<div style="padding:6px 10px;margin:2px 0;background:var(--bg);border-radius:6px;font-size:13px;cursor:pointer" onclick="switchTab('students');setTimeout(()=>renderStudentDetail('${s.id}'),100)">${s.name}${s.level?' · '+s.level:''}</div>`})}
  html+=`</div>`;content.innerHTML=html;
}
function openOrgModal(oid){
  oEditingId=oid||null;
  D.getElementById('orgModalTitle').textContent=oid?'编辑机构':'添加机构';
  D.getElementById('btnDeleteOrg').style.display=oid?'block':'none';
  D.getElementById('orgId').value=oid||'';
  if(oid){const o=orgs.find(x=>x.id===oid);if(!o)return;D.getElementById('oNameI').value=o.name;D.getElementById('oLocation').value=o.location||'';D.getElementById('oCampus').value=o.campus||''}
  else{D.getElementById('oNameI').value='';D.getElementById('oLocation').value='';D.getElementById('oCampus').value=''}
  D.getElementById('orgModal').style.display='flex';
}
function saveOrg(){
  const name=D.getElementById('oNameI').value.trim();if(!name){toast('请输入机构名称');return}
  const campus=D.getElementById('oCampus').value.trim();
  const key=name+'|||'+campus;
  if(oEditingId){const dup=orgs.find(x=>x.name+'|||'+(x.campus||'')===key&&x.id!==oEditingId);if(dup){toast('该机构-校区组合已存在');return}}
  else{if(orgs.find(x=>x.name+'|||'+(x.campus||'')===key)){toast('该机构-校区组合已存在');return}}
  const org={id:oEditingId||genId(),name,location:D.getElementById('oLocation').value.trim(),campus};
  if(oEditingId)orgs=orgs.map(x=>x.id===oEditingId?org:x);else orgs.push(org);
  save(SK_O,orgs);D.getElementById('orgModal').style.display='none';renderOrgList();toast(oEditingId?'机构已更新':'机构已添加');
}
function deleteOrg(){
  if(!oEditingId)return;const count=courses.filter(c=>c.organizationId===oEditingId).length;
  if(!confirm(`删除后${count?count+'门关联课程将失去机构信息。':''}确定删除？`))return;
  courses=courses.map(c=>c.organizationId===oEditingId?{...c,organizationId:''}:c);save(SK_C,courses);
  students=students.map(s=>s.organizationId===oEditingId?{...s,organizationId:''}:s);save(SK_S,students);
  orgs=orgs.filter(x=>x.id!==oEditingId);save(SK_O,orgs);D.getElementById('orgModal').style.display='none';renderOrgList();toast('机构已删除');
}

  const course={id:editingId||genId(),name,studentId,location:D.getElementById('cLocation').value.trim(),organizationId:D.getElementById('cOrgId').value,tuition,date:D.getElementById('cDate').value,startTime:st,endTime:et,color:D.getElementById('cColor').value,repeat,repeatUntil:repeat==='weekly'?repeatUntil:'',note:D.getElementById('cNote').value.trim(),marks:editingId?courses.find(x=>x.id===editingId)?.marks||{}:{}};
  if(editingId) courses=courses.map(x=>x.id===editingId?course:x);else courses.push(course);

function updateExportPreview(){
  const s=students.find(x=>x.id===expStudentId);if(!s)return;
  const from=D.getElementById('expStart').value,to=D.getElementById('expEnd').value;
  const filtered=courses.filter(c=>c.studentId===expStudentId).sort((a,b)=>a.date.localeCompare(b.date));
  let txt=`学生: ${s.name}${s.level?' ('+s.level+')':''}\n课程日期范围: ${from||'?'} ~ ${to||'?'}\n${'─'.repeat(30)}\n`;
  let total=0;
  filtered.forEach(c=>{
    const dates=getExpandedDates(c);dates.forEach(d=>{if((!from||d>=from)&&(!to||d<=to)){txt+=`\n${fmtMD(d)} ${DAY_NAMES[dow(d)-1]} ${c.startTime}-${c.endTime} ${c.name}\n  ${c.location||''} 💰¥${c.tuition||0} ${getOrgName(c.organizationId)||''}\n`;total+=c.tuition||0}});
  });
  txt+=`\n${'─'.repeat(30)}\n学费合计: ¥${total}\n共 ${txt.split('\n').filter(l=>l.includes('💰')).length} 节课`;
  D.getElementById('exportPreview').textContent=txt;
}
function copyExport(){const txt=D.getElementById('exportPreview').textContent;navigator.clipboard.writeText(txt).then(()=>toast('已复制')).catch(()=>toast('复制失败'))}

// ============================================================
// ICS EXPORT
// ============================================================
function escapeICS(s){return(s||'').replace(/[\\;,]/g,'\\$&').replace(/\n/g,'\\n')}
function fmtDateICS(d,t){const[p,m]=t.split(':');const dt=new Date(d+'T00:00:00');dt.setHours(+p,+m,0,0);return dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
function generateICS(){
  let ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TS//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+escapeICS(config.scheduleName)];
  courses.forEach(c=>{
    const sname=getStudentName(c.studentId);const oname=getOrgName(c.organizationId);
    const dates=getExpandedDates(c);
    dates.forEach(d=>{
      const sum='📚 '+c.name+(sname?' ('+sname+')':'');
      const loc=[c.location,oname].filter(Boolean).join(' / ');
      const desc=['学生: '+(sname||'未指定'),'地点: '+(c.location||'未指定'),'机构: '+(oname||'未指定'),'学费: ¥'+(c.tuition||0),c.note].filter(Boolean).join('\\n');
      ics.push('BEGIN:VEVENT','DTSTART:'+fmtDateICS(d,c.startTime),'DTEND:'+fmtDateICS(d,c.endTime),'SUMMARY:'+escapeICS(sum));
      if(loc)ics.push('LOCATION:'+escapeICS(loc));
      ics.push('DESCRIPTION:'+escapeICS(desc),'BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY','DESCRIPTION:课程提醒: '+escapeICS(c.name),'END:VALARM','END:VEVENT');
    });
  });
  ics.push('END:VCALENDAR');return ics.join('\r\n');
}
function exportICS(){
  if(!courses.length){toast('还没有课程');return}
  const ics=generateICS(),b=new Blob([ics],{type:'text/calendar;charset=utf-8'}),fn=config.scheduleName+'.ics';
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([b],fn,{type:'text/calendar'})]})){navigator.share({files:[new File([b],fn,{type:'text/calendar'})]}).catch(()=>dl())}else dl();
  function dl(){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),1e3)}
  toast('📥 日历文件已生成');
}

function clearAllData(){

  toast('所有数据已清空');
}
